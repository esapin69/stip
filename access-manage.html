<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès · STIP</title><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#eef4ff;font:16px system-ui;padding:14px}main{max-width:760px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:16px}button,input{font:inherit}.back{background:#172334;color:white;border:1px solid #344258;border-radius:13px;padding:11px}.card{background:#111c29;border:1px solid #2a394c;border-radius:22px;padding:18px;margin:12px 0}.search{width:100%;padding:15px;border-radius:14px;border:1px solid #344258;background:#08111e;color:white}.person{width:100%;text-align:left;padding:14px;margin:6px 0;border-radius:13px;border:1px solid #334258;background:#182536;color:white}.row{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #283649}.row small{display:block;color:#9eabbc;margin-top:3px}.seg{display:flex;border:1px solid #3a4b61;border-radius:10px;overflow:hidden}.seg button{border:0;background:#0b1420;color:#9eabbc;padding:8px 10px}.seg button.on{background:#88a8ff;color:#08111e;font-weight:800}.seg.locked{opacity:.75}.single{font-size:12px;color:#9eabbc;padding:7px 9px;border:1px solid #3a4b61;border-radius:9px}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:#88a8ff;font-weight:800;margin-top:16px}.secondary{display:block;width:auto;min-width:240px;margin:9px auto 0;border:1px solid #52647d;border-radius:13px;padding:11px 16px;background:#172334;color:#dbe5f5;font-weight:700}.secondary:disabled{opacity:.45}.cancel{display:block;margin:9px auto 0;border:0;background:transparent;color:#9eabbc;padding:10px 18px;font-weight:700}.code{display:flex;gap:8px}.code input{flex:1;min-width:0;padding:13px;border-radius:12px;background:#08111e;color:white;border:1px solid #344258}.muted{color:#9eabbc}.hidden{display:none!important}h1{margin:0}h2{margin:0 0 9px}.current{margin:8px 0 12px;padding:11px;border:1px solid #344258;border-radius:12px;background:#0b1420}.current b{letter-spacing:.14em}.modelLine{display:grid;grid-template-columns:1fr auto;align-items:center;padding:9px 0;border-bottom:1px solid #283649}.modelLine b{font-size:1.03rem}.activityRow{border-top:2px solid #42536a}@media(max-width:520px){.card{padding:15px}.row{grid-template-columns:27px 1fr 108px}.row.nolevel{grid-template-columns:27px 1fr auto}.seg button{padding:8px 7px;font-size:13px}}</style></head><body><main><header><button class="back" onclick="history.back()">← Retour</button><div><small>STIP · SÉCURISÉ</small><h1>Accès</h1></div></header><section class="card"><h2>Choisir une personne</h2><input id="q" class="search" placeholder="Nom, prénom ou GHE…"><div id="people"></div><hr><h3>Créer un accès</h3><button id="newBtn" class="back">Rechercher parmi les agents sans accès</button><div id="candidates"></div></section><section id="editor" class="card hidden"><h2 id="who"></h2><div id="currentCode" class="current"></div><div class="code"><input id="code" inputmode="numeric" maxlength="6" placeholder="Nouveau code · 6 chiffres"><button id="setCode" class="back">Changer</button></div><h3>Profil d’accès</h3><p class="muted">Minimum ou Maximum charge uniquement une présélection. Les cases ci-dessous restent la vérité pour cette personne.</p><div id="modelRows"></div><h3>Accès</h3><div id="apps"></div><button id="save" class="primary">Enregistrer</button><button id="saveModel" class="secondary" disabled>Enregistrer ce profil par défaut</button><button id="cancel" class="cancel">Annuler</button></section><p id="msg" class="muted"></p></main><script>const API='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-access-manage',STORE='stip_session_v1';let data,current,selectedModel='',creating=false;async function call(action,body={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-stip-session':localStorage.getItem(STORE)||''},body:JSON.stringify({action,...body})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Erreur');return j}const e=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{data=await call('list',{q:e('q').value});renderPeople()}catch(x){e('msg').textContent=x.message}}function renderPeople(){e('people').innerHTML=data.people.map((p,i)=>`<button class="person" data-i="${i}"><b>${esc(p.agents?.prenom||'')} ${esc(p.agents?.nom||'Profil externe')}</b><br><small>GHE ${esc(String(p.agents?.ghe||p.role_key||'').replace(/^GHE\s*/i,''))}</small></button>`).join('');e('people').querySelectorAll('button').forEach(b=>b.onclick=()=>edit(data.people[+b.dataset.i]))}function modelUI(){const roles=[['brancardier','Brancardier'],['responsable','Responsable'],['cadre','Cadre']];e('modelRows').innerHTML=roles.map(([r,l])=>`<div class="modelLine"><b>${l}</b><div class="seg"><button data-model="${r}_minimum">Minimum</button><button data-model="${r}_maximum">Maximum</button></div></div>`).join('');e('modelRows').querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>chooseModel(b.dataset.model));paintModel()}function paintModel(){e('modelRows').querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('on',b.dataset.model===selectedModel));let m=data.models.find(x=>x.model_key===selectedModel);e('saveModel').disabled=!m;e('saveModel').textContent=m?`Enregistrer ${m.label} par défaut`:'Enregistrer ce profil par défaut'}function chooseModel(k){selectedModel=k;let m=data.models.find(x=>x.model_key===k);if(!m)return;renderApps(m.permissions||{});paintModel()}function renderApps(perm={}){let levels=perm.__levels||{};e('apps').innerHTML=data.apps.map(a=>{const level=a.pro_only?'pro':(levels[a.key]||'visitor');const control=!a.levels?'<span class="single">Oui / Non</span>':a.pro_only?'<span class="single">Pro uniquement</span>':`<div class="seg"><button type="button" data-level="${a.key}" data-v="visitor" class="${level==='visitor'?'on':''}">Visiteur</button><button type="button" data-level="${a.key}" data-v="pro" class="${level==='pro'?'on':''}">Pro</button></div>`;return`<label class="row ${!a.levels?'nolevel':''} ${a.key==='activity'?'activityRow':''}"><input type="checkbox" data-perm="${a.key}" ${perm[a.key]?'checked':''}><span><b>${esc(a.label)}</b><small>${esc(a.help)}</small></span>${control}</label>`}).join('');e('apps').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{let k=b.dataset.level;e('apps').querySelectorAll(`[data-level="${k}"]`).forEach(x=>x.classList.toggle('on',x===b))})}function collect(){let permissions={},levels={};document.querySelectorAll('[data-perm]').forEach(x=>permissions[x.dataset.perm]=x.checked);data.apps.forEach(a=>{if(!a.levels)return;if(a.pro_only){levels[a.key]='pro';return}let on=e('apps').querySelector(`[data-level="${a.key}"].on`);levels[a.key]=on?.dataset.v||'visitor'});return{permissions,levels}}function edit(p){creating=false;current=p;selectedModel=p.access_model_key||'';e('editor').classList.remove('hidden');e('who').textContent=`${p.agents?.prenom||''} ${p.agents?.nom||'Accès'}`.trim();e('currentCode').innerHTML=p.current_code?`Code actuel : <b>${esc(p.current_code)}</b>`:'Code actuel : <span class="muted">non disponible</span>';e('setCode').textContent='Changer';e('save').textContent='Enregistrer';modelUI();renderApps(p.permissions||{});paintModel();scrollTo({top:e('editor').offsetTop-10,behavior:'smooth'})}function editNew(a){creating=true;current={agent_id:a.id,agents:a};selectedModel='';e('editor').classList.remove('hidden');e('who').textContent=`${a.prenom||''} ${a.nom||''}`.trim();e('currentCode').innerHTML='<span class="muted">Nouvel accès : choisis un modèle et saisis un code à 6 chiffres.</span>';e('code').value='';e('setCode').textContent='Code';e('save').textContent='Créer l’accès';modelUI();renderApps({});paintModel();scrollTo({top:e('editor').offsetTop-10,behavior:'smooth'})}e('save').onclick=async()=>{if(!current)return;try{if(creating){let code=e('code').value.replace(/\D/g,'');if(!selectedModel)throw Error('Choisis d’abord un profil Minimum ou Maximum.');if(!/^\d{6}$/.test(code))throw Error('Saisis un code à 6 chiffres.');await call('create_access',{agent_id:current.agent_id,model_key:selectedModel,code});e('msg').textContent='Accès créé.';creating=false;current=null;selectedModel='';e('editor').classList.add('hidden');e('code').value='';e('candidates').innerHTML='';await load();scrollTo({top:0,behavior:'smooth'});return}await call('save',{profile_id:current.id,model_key:selectedModel,...collect()});e('msg').textContent='Accès enregistré pour cette personne.';await load()}catch(x){e('msg').textContent=x.message}};e('saveModel').onclick=async()=>{if(!selectedModel)return;try{let j=await call('save_model',{model_key:selectedModel,...collect()});data.models=j.models;let m=data.models.find(x=>x.model_key===selectedModel);e('msg').textContent=`${m.label} est maintenant le profil par défaut.`;paintModel()}catch(x){e('msg').textContent=x.message}};e('cancel').onclick=()=>{creating=false;current=null;selectedModel='';e('editor').classList.add('hidden');e('code').value='';e('msg').textContent='';scrollTo({top:0,behavior:'smooth'})};e('setCode').onclick=async()=>{if(!current)return;if(creating){e('msg').textContent='Le code sera enregistré avec « Créer l’accès ».';return}try{let j=await call('set_code',{profile_id:current.id,code:e('code').value});current.current_code=j.code;e('currentCode').innerHTML=`Code actuel : <b>${esc(j.code)}</b>`;e('code').value=''}catch(x){e('msg').textContent=x.message}};e('newBtn').onclick=async()=>{try{let j=await call('find_new',{q:e('q').value});e('candidates').innerHTML=j.candidates.map((a,i)=>`<button class="person" data-candidate="${i}"><b>${esc(a.prenom||'')} ${esc(a.nom||'')}</b><br><small>GHE ${esc(String(a.ghe||'—').replace(/^GHE\s*/i,''))}</small></button>`).join('')||'<p class="muted">Aucun agent sans accès trouvé.</p>';e('candidates').querySelectorAll('[data-candidate]').forEach(b=>b.onclick=()=>editNew(j.candidates[+b.dataset.candidate]))}catch(x){e('msg').textContent=x.message}};let t;e('q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};load();</script><script src="quick-access-universal.js?v=20260901-quick5"></script></body></html>
