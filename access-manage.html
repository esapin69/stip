<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès · STIP</title><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#eef4ff;font:16px system-ui;padding:18px}main{max-width:760px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:20px}button,input,select{font:inherit}.back{background:#172334;color:white;border:1px solid #344258;border-radius:14px;padding:12px}.card{background:#111c29;border:1px solid #2a394c;border-radius:24px;padding:20px;margin:14px 0}.search{width:100%;padding:16px;border-radius:15px;border:1px solid #344258;background:#08111e;color:white}.person{width:100%;text-align:left;padding:15px;margin:7px 0;border-radius:14px;border:1px solid #334258;background:#182536;color:white}.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #283649}.row small{display:block;color:#9eabbc;margin-top:3px}.row select{background:#0b1420;color:white;border:1px solid #3a4b61;border-radius:9px;padding:8px}.actions label{display:flex;gap:10px;padding:10px 0}.primary{width:100%;border:0;border-radius:16px;padding:16px;background:#88a8ff;font-weight:800}.code{display:flex;gap:8px}.code input{flex:1;padding:14px;border-radius:12px;background:#08111e;color:white;border:1px solid #344258}.muted{color:#9eabbc}.hidden{display:none!important}h1{margin:0}h2{margin:0 0 10px}</style></head><body><main><header><button class="back" onclick="history.back()">← Retour</button><div><small>STIP · SÉCURISÉ</small><h1>Accès</h1></div></header><section class="card"><h2>Choisir une personne</h2><input id="q" class="search" placeholder="Nom, prénom ou GHE…"><div id="people"></div><hr><h3>Créer un accès</h3><p class="muted">Recherche un agent sans accès, choisis-le puis définis immédiatement son code à 6 chiffres.</p><button id="newBtn" class="back">Rechercher parmi les agents sans accès</button><div id="candidates"></div></section><section id="editor" class="card hidden"><h2 id="who"></h2><div class="code"><input id="code" inputmode="numeric" maxlength="6" placeholder="Nouveau code · 6 chiffres"><button id="setCode" class="back">Définir le code</button></div><h3>Applications</h3><div id="apps"></div><h3>Actions</h3><div id="actions" class="actions"></div><button id="save" class="primary">Enregistrer</button></section><p id="msg" class="muted"></p></main><script>const API='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-access-manage',STORE='stip_session_v1';let data,current;async function call(action,body={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-stip-session':localStorage.getItem(STORE)||''},body:JSON.stringify({action,...body})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Erreur');return j}const e=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{data=await call('list',{q:e('q').value});renderPeople()}catch(x){e('msg').textContent=x.message}}function renderPeople(){e('people').innerHTML=data.people.map((p,i)=>`<button class="person" data-i="${i}"><b>${esc(p.agents?.prenom||'')} ${esc(p.agents?.nom||'Profil externe')}</b><br><small>${esc(p.agents?.ghe||p.role_key||'')}</small></button>`).join('');e('people').querySelectorAll('button').forEach(b=>b.onclick=()=>edit(data.people[+b.dataset.i]))}function edit(p){current=p;e('editor').classList.remove('hidden');e('who').textContent=`${p.agents?.prenom||''} ${p.agents?.nom||'Accès'}`.trim();let perm=p.permissions||{},levels=perm.__levels||{};e('apps').innerHTML=data.apps.map(a=>`<label class="row"><input type="checkbox" data-perm="${a.key}" ${perm[a.key]?'checked':''}><span><b>${esc(a.label)}</b><small>${esc(a.help)}</small></span><select data-level="${a.key}"><option ${levels[a.key]==='visitor'?'selected':''} value="visitor">Visiteur</option><option ${levels[a.key]==='pro'?'selected':''} value="pro">Pro</option></select></label>`).join('');e('actions').innerHTML=data.actions.map(a=>`<label><input type="checkbox" data-perm="${a.key}" ${perm[a.key]?'checked':''}> ${esc(a.label)}</label>`).join('');scrollTo({top:e('editor').offsetTop-10,behavior:'smooth'})}e('save').onclick=async()=>{if(!current)return;let permissions={},levels={};document.querySelectorAll('[data-perm]').forEach(x=>permissions[x.dataset.perm]=x.checked);document.querySelectorAll('[data-level]').forEach(x=>levels[x.dataset.level]=x.value);try{await call('save',{profile_id:current.id,permissions,levels});e('msg').textContent='Accès enregistré.';await load()}catch(x){e('msg').textContent=x.message}};e('setCode').onclick=async()=>{if(!current)return;try{await call('set_code',{profile_id:current.id,code:e('code').value});e('code').value='';e('msg').textContent='Code mis à jour.'}catch(x){e('msg').textContent=x.message}};e('newBtn').onclick=async()=>{try{let j=await call('find_new',{q:e('q').value});e('candidates').innerHTML=j.candidates.map(a=>`<button class="person" data-id="${a.id}"><b>${esc(a.prenom||'')} ${esc(a.nom||'')}</b><br><small>GHE ${esc(a.ghe||'—')}</small></button>`).join('')||'<p class="muted">Aucun agent sans accès trouvé.</p>';e('candidates').querySelectorAll('button').forEach(b=>b.onclick=async()=>{let code=prompt('Code à 6 chiffres pour ce nouvel accès :')||'';try{await call('create_access',{agent_id:b.dataset.id,code});e('msg').textContent='Accès créé.';await load()}catch(x){e('msg').textContent=x.message}})}catch(x){e('msg').textContent=x.message}};let t;e('q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};load();</script></body></html>
