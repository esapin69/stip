<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4f45">
  <meta name="robots" content="noindex,nofollow">
  <title>Chat équipe · STIP</title>
  <link rel="manifest" href="/team-chat.webmanifest?v=2">
  <link rel="icon" type="image/svg+xml" href="/images/icone_app/team-chat.svg">
  <link rel="apple-touch-icon" href="/images/icone_app/team-chat.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f3f7f6;color:#102923;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(390px,100%);padding:28px 22px;border:1px solid #dbe7e3;border-radius:28px;background:#fff;box-shadow:0 18px 45px rgba(15,55,45,.1);text-align:center}.icon{width:94px;height:94px;margin:auto;border-radius:24px;box-shadow:0 10px 24px rgba(11,79,69,.18)}h1{margin:18px 0 6px;font-size:1.35rem}p{margin:0 0 20px;color:#60736e;font-size:.82rem;line-height:1.45}.actions{display:grid;gap:9px}button,a{min-height:52px;border-radius:15px;font:inherit;font-weight:850;text-decoration:none;display:grid;place-items:center}button{border:0;background:#0b6d59;color:#fff}a{border:1px solid #d8e5e1;background:#f8fbfa;color:#163a31}.hint{min-height:20px;margin-top:12px;color:#60736e;font-size:.7rem}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/images/icone_app/team-chat.svg" alt="">
    <h1>Chat équipe</h1>
    <p>Accès direct au chat STIP depuis l’écran d’accueil du téléphone.</p>
    <div class="actions">
      <button id="installBtn" type="button">Ajouter à l’écran d’accueil</button>
      <a href="/?quick=teamchat">Ouvrir le chat</a>
    </div>
    <div class="hint" id="hint"></div>
  </main>
  <script>
    const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
    if(standalone) location.replace("/?quick=teamchat");
    let installPrompt=null;
    const btn=document.getElementById("installBtn"),hint=document.getElementById("hint");
    addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;btn.hidden=false});
    btn.addEventListener("click",async()=>{
      if(installPrompt){
        installPrompt.prompt();
        await installPrompt.userChoice.catch(()=>null);
        installPrompt=null;
        return;
      }
      hint.textContent="Si le bouton d’installation n’apparaît pas : menu du navigateur → Ajouter à l’écran d’accueil.";
    });
    addEventListener("appinstalled",()=>{hint.textContent="Raccourci ajouté.";btn.disabled=true});
  </script>
</body>
</html>
