<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Dépôt · STIP</title><link rel="stylesheet" href="stip-theme.css?v=20260925-filter-mobile1"><link rel="stylesheet" href="stip-shell.css?v=20260919-refactor1"><style>.dep-page{max-width:720px}.dep-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.dep-card{padding:18px;border:1px solid var(--stip-line);border-radius:var(--stip-radius-lg);background:var(--stip-surface-raised);box-shadow:var(--stip-shadow-soft)}.dep-user{display:flex;align-items:center;justify-content:space-between;gap:12px}.dep-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.dep-pick label{display:grid;place-items:center;min-height:105px;padding:14px;border:1px dashed var(--stip-line-strong);border-radius:14px;background:var(--stip-surface-soft);text-align:center;cursor:pointer}.dep-pick input{display:none}.dep-pick b{display:block}.dep-pick span{display:block;margin-top:5px;color:var(--stip-muted);font-size:.75rem}.dep-files{display:grid;gap:7px}.dep-file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 11px;border:1px solid var(--stip-line);border-radius:11px;background:var(--stip-surface-soft)}.dep-file strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dep-file small{color:var(--stip-muted)}.dep-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.dep-status{min-height:1.2em;margin-top:12px;color:var(--stip-muted);font-weight:750}.dep-status.bad{color:#a43d3d}.dep-status.ok{color:#187554}.dep-bar{height:8px;margin-top:12px;border-radius:999px;background:var(--stip-surface-soft);overflow:hidden}.dep-bar i{display:block;width:0;height:100%;background:var(--stip-accent);transition:width .2s}.hidden{display:none!important}@media(max-width:520px){.dep-pick{grid-template-columns:1fr}}</style></head><body data-stip-app="upload"><main class="stip-page dep-page"><header class="dep-head"><button id="depBack" class="stip-btn secondary" type="button">← Retour</button><div><span class="stip-kicker">STIP · SÉCURISÉ</span><h1 class="stip-title">DÉPÔT</h1><p class="stip-subtitle">Fichiers & dossiers</p></div></header><section class="dep-card"><div class="dep-user"><div><span class="stip-kicker">CONNECTÉ</span><strong id="depUser">Chargement…</strong></div><span>📥</span></div><div class="dep-pick"><label><input id="depFiles" type="file" multiple><b>Choisir des fichiers</b><span>PDF, Excel, images, ZIP…</span></label><label><input id="depFolder" type="file" webkitdirectory directory multiple><b>Choisir un dossier</b><span>Arborescence conservée</span></label></div><div id="depList" class="dep-files"></div><div id="depBar" class="dep-bar hidden"><i></i></div><div id="depStatus" class="dep-status"></div><div class="dep-actions"><button id="depSend" class="stip-btn" type="button" disabled>Envoyer</button><button id="depClear" class="stip-btn secondary" type="button">Vider</button></div><p class="stip-subtitle" style="margin-top:14px">Maximum 50 Mo par fichier. Cette page ajoute uniquement des fichiers dans la boîte d’attente sécurisée.</p></section></main><script src="depot.js?v=20260925-stip1"></script></body></html>
