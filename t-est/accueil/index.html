<!doctype html>
<html lang="fr" data-t-est="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="robots" content="noindex,nofollow">
  <title>T-est — Accueil GHE</title>
  <link rel="stylesheet" href="/stip-theme-base.css?v=20260928-card-signature1">
  <link rel="stylesheet" href="/t-est/regles-communes/global.css?v=20260930-safari-overlay-history1">
  <link rel="stylesheet" href="/t-est/accueil/accueil-v3.css?v=20261013-communication-only1">
  <link rel="stylesheet" href="/t-est/accueil/accueil-historique.css?v=20261013-hist1">
  <script defer src="/t-est/regles-communes/global.js?v=20260930-safari-overlay-history1"></script>
  <script defer src="/stip-session-continuity.js?v=20260927-pin-security1"></script>
  <script defer src="/shift-registry.js?v=20261013-readable-shifts1"></script>
  <!-- T-EST LAB ONLY : le repère de test ne doit pas aller sur la vraie page. -->
  <link rel="stylesheet" href="/t-est/outils-test/bulle-t.css?v=20260927-fire2">
  <script defer src="/t-est/outils-test/bulle-t.js?v=20260927-fire2"></script>
  <script defer src="/t-est/outils-test/navigation-t.js?v=20260928-mirror3"></script>
  <script defer src="/t-est/accueil/accueil-v3.js?v=20261013-communication-only1"></script>
  <script defer src="/t-est/accueil/accueil-v3-canaux.js?v=20261013-canaux1"></script>
  <script defer src="/t-est/accueil/accueil-historique.js?v=20261013-communication-only1"></script>
</head>
<body>
  <nav id="tEstHistoryBar" aria-label="Historique des pages GHE">
    <button type="button" class="t-history-home" data-history-home aria-label="Retourner à l’accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-7v-7h-4v7H3z"/></svg>
      <span>Accueil</span>
    </button>
    <div id="tEstHistoryScroll" class="t-history-window" aria-label="Pages visitées, défilement horizontal">
      <ol class="t-history-items" id="tEstHistorySteps"></ol>
    </div>
  </nav>
  <main id="t-est-accueil">
    <div id="tAccueilHome" class="t-shell">
      <section aria-label="Mon planning">
        <div class="t-separator is-first"><span>Mon planning</span></div>
        <nav class="t-carousel" data-carousel="planning" aria-label="Mon planning">
          <button class="accueil-carte" id="carte-aujourdhui" data-jour="0" type="button" aria-haspopup="dialog">
            <span class="carte-label">Aujourd’hui</span><span class="carte-shift" data-shift></span>
          </button>
          <button class="accueil-carte" id="carte-demain" data-jour="1" type="button" aria-haspopup="dialog">
            <span class="carte-label">Demain</span><span class="carte-shift" data-shift></span>
          </button>
          <div class="accueil-carte" id="carte-semaine"><span class="carte-label">Cette semaine</span></div>
        </nav>
      </section>
      <section aria-label="Communication" class="com-bloc">
        <div class="t-separator"><span>Communication</span></div>
        <nav class="t-carousel" data-carousel="communication" aria-label="Communication">
          <button class="com-carte" type="button" data-ouverture="fauteuils"><span class="com-icone" aria-hidden="true">♿</span><span class="com-libelle">Fauteuils</span></button>
          <button class="com-carte" type="button" data-ouverture="dm"><span class="com-icone" aria-hidden="true">✉️</span><span class="com-libelle">DM · privé</span></button>

        </nav>
        <button class="canal-action" type="button" data-canaux-open aria-haspopup="dialog"><span class="plus" aria-hidden="true">＋</span>Créer / ouvrir un canal</button>
      </section>

    </div>
    <div id="tAccueilSousPage" hidden>
      <header class="t-nav-fixed">
        <div class="t-shell">
          <div class="t-subnav"><button type="button" class="t-retour" data-retour>‹ Accueil GHE</button></div>
          <h2 class="com-titre" id="tModuleTitre">Communication</h2>
          <nav class="t-carousel" data-carousel="communication" data-carousel-detail aria-label="Communication">
            <button class="com-carte" type="button" data-ouverture="fauteuils"><span class="com-icone" aria-hidden="true">♿</span><span class="com-libelle">Fauteuils</span></button>
            <button class="com-carte" type="button" data-ouverture="dm"><span class="com-icone" aria-hidden="true">✉️</span><span class="com-libelle">DM · privé</span></button>
  
          </nav>
          <nav class="t-carousel" data-carousel="planning" data-planning-detail aria-label="Mon planning" hidden>
            <button class="accueil-carte" data-jour="0" type="button" aria-haspopup="dialog"><span class="carte-label">Aujourd’hui</span><span class="carte-shift" data-shift></span></button>
            <button class="accueil-carte" data-jour="1" type="button" aria-haspopup="dialog"><span class="carte-label">Demain</span><span class="carte-shift" data-shift></span></button>
            <div class="accueil-carte"><span class="carte-label">Cette semaine</span></div>
          </nav>
          <button class="canal-action" type="button" data-canaux-open aria-haspopup="dialog"><span class="plus" aria-hidden="true">＋</span>Créer / ouvrir un canal</button>
        </div>
      </header>
      <section class="t-module-body" aria-label="Contenu de la rubrique">
        <p class="t-module-status" id="tModuleStatut" role="status"></p>
        <iframe id="tModuleFrame" class="t-module-iframe" title="Rubrique GHE" loading="eager" referrerpolicy="same-origin"></iframe>
      </section>
    </div>
  </main>
  <dialog class="accueil-pop" id="accueilPop" aria-labelledby="popTitre">
    <section class="pop-contenu">
      <header class="pop-entete"><h2 id="popTitre"></h2><button class="pop-close" type="button" id="fermerPop" aria-label="Fermer">×</button></header>
      <div class="pop-body" id="popBody"></div>
    </section>
  </dialog>
</body>
</html>
