<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>T-est — Accueil / Bloc mois</title>
  <link rel="stylesheet" href="/stip-theme.css?v=20260928-card-signature1">
  <link rel="stylesheet" href="/stip-month-table.css?v=20260928-month-badges1">
  <script defer src="/stip-month-table.js?v=20260928-month-badges1"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f7;color:#24313a}
    body{padding:20px 12px 42px}
    .test-shell{width:min(100%,720px);margin:auto}
    .test-label{margin:0 0 20px;text-align:center;color:#84919b;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .month-separator{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:13px;margin:0 3px 16px;color:#687680}
    .month-separator::before,.month-separator::after{content:"";height:1px;background:linear-gradient(90deg,transparent,#c9d1d6)}
    .month-separator::after{background:linear-gradient(90deg,#c9d1d6,transparent)}
    .month-separator span{font-size:12px;font-weight:950;letter-spacing:.16em}
    .demo-shift{display:grid;place-items:center;min-height:27px;font-size:.83rem;font-weight:950;color:#08778b}
    .demo-shift.rest{font-size:1.1rem}
  </style>
  <link rel="stylesheet" href="/t-est/regles-communes/global.css?v=20260927-sitewide21" />
  <script defer src="/t-est/regles-communes/global.js?v=20260927-sitewide21"></script>
</head>
<body>
<main class="test-shell">
  <p class="test-label">T-est · source commune du tableau mensuel</p>
  <div class="month-separator"><span>AU MOIS</span></div>
  <section class="stip-month-calendar" aria-label="Aperçu calendrier mensuel premium">
    <header class="stip-month-nav">
      <button type="button" aria-label="Mois précédent">‹</button>
      <div><strong>Septembre</strong><small>2026</small></div>
      <button type="button" aria-label="Mois suivant">›</button>
    </header>
    <div class="stip-month-weekdays" aria-hidden="true"><span>LU</span><span>MA</span><span>ME</span><span>JE</span><span>VE</span><span>SA</span><span>DI</span></div>
    <div id="weeks" class="stip-month-grid"></div>
  </section>
</main>
<script>
const shifts={1:'M',2:'M',3:'M',4:'M',5:'🏝️',6:'🏝️',7:'J',8:'J',9:'J',10:'J',11:'🏝️',12:'🏝️',13:'M',14:'M',15:'M',16:'M',17:'🏝️',18:'🏝️',19:'J',20:'J',21:'J',22:'J',23:'🏝️',24:'🏝️',25:'M',26:'M',27:'M',28:'M',29:'🏝️',30:'🏝️'};
const host=document.getElementById('weeks');
for(let day=1;day<=30;day+=1){
  const iso=`2026-09-${String(day).padStart(2,'0')}`;
  const date=new Date(iso+'T12:00:00');
  const shift=shifts[day]||'';
  const cell=document.createElement('div');
  cell.className='stip-month-day'+((date.getDay()===0||date.getDay()===6)?' is-weekend':'')+(day===27?' is-today':'');
  cell.dataset.stipDate=iso;
  cell.innerHTML=`<b class="stip-month-day-number">${day}</b><div class="stip-month-primary"><span class="demo-shift${shift==='🏝️'?' rest':''}">${shift}</span></div><small class="stip-month-events"></small>`;
  host.appendChild(cell);
}
</script>
</body>
</html>
