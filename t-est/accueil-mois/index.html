<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>T-est — Accueil / Bloc mois</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f7;color:#24313a}body{padding:20px 12px 42px}.test-shell{width:min(100%,720px);margin:auto}.test-label{margin:0 0 20px;text-align:center;color:#84919b;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.month-separator{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:13px;margin:0 3px 16px;color:#687680}.month-separator::before,.month-separator::after{content:"";height:1px;background:linear-gradient(90deg,transparent,#c9d1d6)}.month-separator::after{background:linear-gradient(90deg,#c9d1d6,transparent)}.month-separator span{font-size:12px;font-weight:950;letter-spacing:.16em}.month-card{position:relative;overflow:hidden;border:1px solid rgba(39,60,72,.10);border-radius:27px;background:linear-gradient(155deg,#fff 0%,#fbfcfd 58%,#f3f7f8 100%);box-shadow:0 20px 50px rgba(34,56,68,.12),0 2px 7px rgba(34,56,68,.05)}.month-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#0b8095,#1bb6c5,#0b8095)}.month-head{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:19px 15px 15px}.month-title{text-align:center}.month-title strong{display:block;font-size:21px;line-height:1;font-weight:950;letter-spacing:-.035em;color:#183d49}.month-title small{display:block;margin-top:5px;color:#829099;font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.nav{width:44px;height:44px;border:1px solid #e0e6e9;border-radius:15px;background:#fff;color:#315560;font-size:22px;font-weight:800;box-shadow:0 5px 13px rgba(39,60,72,.08)}.calendar{padding:0 12px 14px}.weekdays,.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays{padding:3px 2px 9px;color:#87949c;font-size:10px;font-weight:900;text-align:center;text-transform:uppercase}.week{margin-bottom:6px}.day{position:relative;min-height:68px;padding:8px 5px;border:1px solid #e4e9ec;border-radius:15px;background:#fff;text-align:center;box-shadow:0 2px 5px rgba(37,57,68,.035)}.day .n{display:block;color:#273840;font-size:15px;font-weight:900}.day .shift{display:inline-grid;place-items:center;min-width:28px;height:25px;margin-top:7px;padding:0 6px;border-radius:9px;background:#e9f7f8;color:#08778b;font-size:12px;font-weight:950}.day.rest{background:linear-gradient(150deg,#fff,#f7f9fa)}.day.rest .shift{background:#f1f3f4;color:#7a858b;font-size:14px}.day.today{border:2px solid #0ca8ba;box-shadow:0 0 0 4px rgba(12,168,186,.10),0 7px 16px rgba(15,110,125,.11)}.day.today::after{content:"Aujourd’hui";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);padding:2px 5px;border-radius:6px;background:#0b8fa3;color:#fff;font-size:6px;font-weight:900;letter-spacing:.04em}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 14px 17px;border-top:1px solid #edf0f2;color:#718088;font-size:10px;font-weight:800}.legend b{color:#08778b}.note{margin:14px 5px 0;color:#8a969d;font-size:10px;line-height:1.45;text-align:center}@media(max-width:430px){body{padding:14px 8px 30px}.month-card{border-radius:23px}.month-head{grid-template-columns:46px 1fr 46px;padding:17px 10px 13px}.nav{width:40px;height:40px}.calendar{padding:0 7px 11px}.weekdays,.week{gap:4px}.day{min-height:61px;padding:7px 2px;border-radius:12px}.day .n{font-size:14px}.day .shift{min-width:25px;height:23px;margin-top:6px;font-size:11px}.month-title strong{font-size:19px}}
  </style>
  <link rel="stylesheet" href="/t-est/regles-communes/global.css?v=20260927-sitewide21" />
  <script defer src="/t-est/regles-communes/global.js?v=20260927-sitewide21"></script>
</head>
<body>
<main class="test-shell">
  <p class="test-label">T-est · Accueil · essai isolé</p>
  <div class="month-separator"><span>AU MOIS</span></div>
  <section class="month-card" aria-label="Aperçu calendrier mensuel premium">
    <header class="month-head"><button class="nav" aria-label="Mois précédent">‹</button><div class="month-title"><strong>Septembre 2026</strong><small>Planning personnel</small></div><button class="nav" aria-label="Mois suivant">›</button></header>
    <div class="calendar">
      <div class="weekdays"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
      <div id="weeks"></div>
    </div>
    <div class="legend"><span><b>M</b> Matin</span><span><b>J</b> Journée</span><span>🏝️ Repos</span></div>
  </section>
  <p class="note">Prototype visuel uniquement : aucun moteur calendrier, aucune donnée et aucune règle commune du site ne sont modifiés.</p>
</main>
<script>
const shifts={1:'M',2:'M',3:'M',4:'M',5:'🏝️',6:'🏝️',7:'J',8:'J',9:'J',10:'J',11:'🏝️',12:'🏝️',13:'M',14:'M',15:'M',16:'M',17:'🏝️',18:'🏝️',19:'J',20:'J',21:'J',22:'J',23:'🏝️',24:'🏝️',25:'M',26:'M',27:'M',28:'M',29:'🏝️',30:'🏝️'};
const host=document.getElementById('weeks');let d=1;for(let w=0;w<5;w++){const row=document.createElement('div');row.className='week';for(let i=0;i<7;i++){const cell=document.createElement('div');if(d<=30){const s=shifts[d]||'';cell.className='day'+(s==='🏝️'?' rest':'')+(d===27?' today':'');cell.innerHTML=`<span class="n">${d}</span><span class="shift">${s}</span>`;d++}else{cell.className='day';cell.style.visibility='hidden'}row.appendChild(cell)}host.appendChild(row)}
</script>
</body>
</html>
