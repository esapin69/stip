<body data-stip-app="compare">
<main class="shell">
<header class="head"><button class="back" type="button" aria-label="Retour" onclick="location.href='index.html?quick=public'">‹</button><div><span class="kicker">PLANNING · STIP</span><h1>Comparer les plannings</h1><p>Mon planning avec un ou plusieurs agents.</p></div></header>
<section id="picker" class="picker hidden"><div class="picker-top"><strong>Avec qui ?</strong><small id="teamLabel"></small></div><div id="selected" class="selected"></div><label class="search"><span>⌕</span><input id="search" type="search" autocomplete="off" placeholder="Rechercher un agent…"></label><div id="results" class="results"></div><button id="compareBtn" class="compare" type="button" disabled>Comparer</button></section>
<section id="view" class="view hidden"></section><div id="status" class="status">Ouverture des plannings…</div>
</main>
<script>
(()=>{'use strict';
const DATA='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-data',ACCESS='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-access',STORE='stip_session_v1',$=s=>document.querySelector(s),selected=new Map();
const TONE={M:'#1688d3',J:'#20a765',J4:'#f2763e',S:'#dea72d',N:'#6e55d8',RH:'#748594',RTT:'#748594',RTTA:'#748594',RC:'#748594',CA:'#748594',RF:'#748594',AA:'#748594',MA:'#748594',RTA:'#748594',SYR:'#748594',ABS:'#748594',OFF:'#748594',REPOS:'#748594','-':'#8a9ba1'};
let session=null,spirit=null,agents=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),name=a=>[a?.prenom,a?.nom].filter(Boolean).join(' ').trim()||'Agent';
async function call(url,action){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-STIP-Session':localStorage.getItem(STORE)||''},body:JSON.stringify({action})}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||`Erreur ${r.status}`);return j}
function paris(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=k=>p.find(x=>x.type===k)?.value||'';return`${g('year')}-${g('month')}-${g('day')}`}
function add(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return paris(d)}
function weekNo(iso){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+3-((x.getDay()+6)%7));const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/86400000-3+((w1.getDay()+6)%7))/7)}
function monthStart(){return paris().slice(0,7)+'-01'}
function daysInMonth(){const [y,m]=paris().slice(0,7).split('-').map(Number);return new Date(y,m,0).getDate()}
function rowsFor(a){const key=a?.source_key;return(spirit?.planning||[]).filter(r=>r.agents?.source_key===key)}
function mapRows(a){return new Map(rowsFor(a).map(r=>[String(r.date||'').slice(0,10),r]))}
function collectAgents(){const m=new Map();for(const r of spirit?.planning||[]){const a=r.agents||{};if(a.source_key)m.set(a.source_key,a)}agents=[...m.values()].sort((a,b)=>name(a).localeCompare(name(b),'fr',{sensitivity:'base'}))}
function shiftKey(code){const k=String(code||'').trim().toUpperCase();if(k==='M0130'||k==='M0131')return'M';return k}
function tone(code){return TONE[shiftKey(code)]||'#277b86'}
function toneInk(code){return shiftKey(code)==='S'?'#3f3200':'#fff'}
function asset(code){const s=spirit?.media?.shifts||{},k=shiftKey(code);return s[k]||s[`${k}.PNG`]||s[`${k}.JPG`]||s[`${k}.JPEG`]||s[`${k}.WEBP`]||''}
function shiftVisual(code){const clean=String(code||'').trim().toUpperCase();if(!clean||clean==='-'||clean==='—')return'';const img=asset(clean);return img?`<span class="shift"><img src="${esc(img)}" alt="${esc(clean)}"></span>`:`<span class="shift"><strong>${esc(clean)}</strong></span>`}
function chips(){$('#selected').innerHTML=selected.size?[...selected.values()].map(a=>`<button type="button" data-remove="${esc(a.source_key)}">${esc(name(a))} ×</button>`).join(''):'<span>Aucun agent sélectionné</span>';$('#selected').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);paintPicker()})}
function paintPicker(){chips();const q=norm($('#search').value),self=session?.agent?.source_key,list=q?agents.filter(a=>a.source_key!==self&&!selected.has(a.source_key)&&norm(name(a)).includes(q)).slice(0,25):[];$('#results').innerHTML=q?(list.length?list.map(a=>`<button type="button" data-pick="${esc(a.source_key)}"><span><strong>${esc(name(a))}</strong>${a.ghe?`<small>${esc(a.ghe)}</small>`:''}</span><b>＋</b></button>`).join(''):'<p>Aucun agent trouvé.</p>'):'<p>Tape une lettre pour rechercher.</p>';$('#results').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const a=agents.find(x=>x.source_key===b.dataset.pick);if(a){selected.set(a.source_key,a);$('#search').value='';paintPicker();$('#search').focus()}});$('#compareBtn').disabled=!selected.size;$('#compareBtn').textContent=selected.size>1?`Comparer avec ${selected.size} agents`:'Comparer avec cet agent'}
function day(iso,row){const d=new Date(iso+'T12:00:00'),r=row.get(iso),raw=String(r?.code||r?.source_value||'').trim().toUpperCase(),empty=!raw||raw==='-'||raw==='—',code=empty?'':raw,today=iso===paris(),c=tone(empty?'-':code),ink=toneInk(empty?'-':code),label=d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','').toUpperCase(),visual=shiftVisual(code);return`<div class="day ${today?'today':''} ${empty?'empty':'work'}" style="--shift:${esc(c)};--shift-ink:${esc(ink)}"><div class="day-inner"><div class="day-top"><span>${esc(label)}</span><span>${esc(code)}</span></div><div class="day-body"><b>${d.getDate()}</b>${visual}</div></div></div>`}
function stack(a,dates){const row=mapRows(a);let out='',last=-1;dates.forEach(iso=>{const w=weekNo(iso);if(w!==last){out+=`<div class="week">SEMAINE ${w}</div>`;last=w}out+=day(iso,row)});return out}
function syncNames(){const sc=$('#compareScroll'),bar=$('#namebar');if(!sc||!bar)return;const sync=()=>{bar.scrollLeft=sc.scrollLeft};sc.addEventListener('scroll',sync,{passive:true});sync()}
function render(){if(!selected.size)return;const self=session?.agent||{},cols=[self,...selected.values()],start=monthStart(),days=daysInMonth(),dates=Array.from({length:days},(_,i)=>add(start,i)),canChange=!!session?.permissions?.change_app,monthLabel=new Date(start+'T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),headers=cols.map((a,i)=>`<header class="name-card ${i===0?'mine':''}"><small>${i===0?'MON PLANNING':'AGENT'}</small><strong>${esc(i===0?'Moi':name(a))}</strong></header>`).join(''),columns=cols.map((a,i)=>`<section class="col ${i===0?'mine':''}"><div class="days">${stack(a,dates)}</div></section>`).join('');$('#picker').classList.add('hidden');$('#view').classList.remove('hidden');$('#view').innerHTML=`<div class="view-head"><div><small>COMPARAISON</small><h2>${cols.length} plannings côte à côte</h2></div><button type="button" id="edit">Modifier</button></div><p class="hint">Glisse horizontalement pour voir les autres agents →</p><div class="month-title">${esc(monthLabel)}</div><div class="namebar" id="namebar"><div class="namecols">${headers}</div></div><div class="scroll" id="compareScroll"><div class="cols">${columns}</div></div>${canChange?'<div class="actions"><button class="change" id="change" type="button">Demander un changement</button></div>':''}`;syncNames();$('#edit').onclick=()=>{$('#view').classList.add('hidden');$('#picker').classList.remove('hidden');paintPicker()};$('#change')?.addEventListener('click',()=>location.href='index.html?quick=change')}
async function boot(){const token=localStorage.getItem(STORE)||'';if(!token){location.replace('index.html');return}try{[session,spirit]=await Promise.all([call(ACCESS,'me'),call(DATA,'spirit')]);if(!session?.permissions?.planning_team)throw Error('Comparaison non autorisée.');collectAgents();$('#teamLabel').textContent=spirit.team?`Équipe ${spirit.team}`:'';$('#status').classList.add('hidden');$('#picker').classList.remove('hidden');paintPicker()}catch(e){$('#status').textContent=e.message||'Comparaison indisponible.'}}
$('#search').addEventListener('input',paintPicker);$('#compareBtn').onclick=render;boot()})();
</script>
