<style>
:root{--bg:#eef5f6;--ink:#123b4b;--muted:#6b838c;--line:#d4e2e6;--accent:#0d4257;--cyan:#0798b5;--panel:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.shell{width:min(100%,820px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(122px + env(safe-area-inset-bottom))}.head{display:flex;align-items:flex-start;gap:12px}.back{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:1.6rem}.kicker{display:block;color:var(--cyan);font-size:.66rem;font-weight:950;letter-spacing:.13em}.head h1{margin:3px 0 0;font-size:2rem;line-height:1;letter-spacing:-.04em}.head p{margin:7px 0 0;color:var(--muted);font-size:.83rem;font-weight:700}.picker{margin-top:22px;padding:15px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 9px 24px rgba(18,59,75,.07)}.picker-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.picker-top strong{font-size:1.02rem}.selected{display:flex;gap:7px;overflow:auto;margin:12px 0 9px}.selected button{white-space:nowrap;border:0;border-radius:999px;background:#e8f6f8;color:#0d5967;padding:8px 10px;font-weight:850}.selected span{color:#84969c;font-size:.75rem;padding:7px 2px}.search{display:grid;grid-template-columns:34px 1fr;align-items:center;border:1px solid #cbdde1;border-radius:15px;background:#f8fbfc;padding:0 10px}.search input{height:48px;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}.results{max-height:235px;overflow:auto;margin-top:5px}.results button{width:100%;border:0;border-bottom:1px solid #edf2f3;background:#fff;padding:11px 4px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--ink)}.results button span{display:grid}.results small{margin-top:2px;color:var(--muted)}.results p{text-align:center;color:var(--muted);font-size:.78rem;padding:10px}.compare{width:100%;height:48px;margin-top:8px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:950}.compare:disabled{opacity:.35}.view{margin-top:18px}.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}.view-head small{display:block;color:var(--cyan);font-size:.61rem;font-weight:950;letter-spacing:.12em}.view-head h2{margin:2px 0 0;font-size:1.03rem}.view-head button{border:0;border-radius:10px;background:#dfeff2;color:var(--ink);padding:8px 10px;font-weight:850}.hint{margin:0 0 9px;color:var(--muted);font-size:.7rem;font-weight:700}.scroll{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:6px}.cols{display:flex;align-items:flex-start;gap:10px;width:max-content}.col{width:154px;flex:0 0 154px}.col.mine{position:sticky;left:0;z-index:4}.col>header{height:58px;padding:8px 9px;border:1px solid var(--line);border-radius:16px;background:#f8fcfd;display:grid;align-content:center;box-shadow:0 5px 12px rgba(13,66,87,.05)}.col.mine>header{background:#e9f8fa;border-color:#b7dfe5}.col>header small{color:var(--cyan);font-size:.54rem;font-weight:950;letter-spacing:.08em}.col>header strong{font-size:.77rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.days{display:grid;gap:8px;padding-top:8px}.week{height:19px;display:flex;align-items:center;gap:5px;color:#6b8189;font-size:.52rem;font-weight:950}.week:before,.week:after{content:"";height:1px;flex:1;background:#c6d5d9}.day{min-height:92px;border:1px solid #d5e1e4;border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 6px 12px rgba(18,59,75,.06)}.day.today{outline:3px solid var(--accent);outline-offset:-3px}.day-top{height:27px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#176fca;color:#fff;font-size:.58rem;font-weight:950}.day-body{min-height:65px;display:grid;grid-template-columns:42px 1fr;align-items:center;padding:5px 7px}.day-body b{font-size:1.45rem;text-align:center}.code{display:grid;place-items:center;min-height:45px;border-radius:12px;background:#eff6f7;color:var(--accent);font-size:.78rem;font-weight:950}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;min-height:46px;border:0;border-radius:14px;font-weight:900}.more{background:#e2eff2;color:var(--ink)}.change{background:var(--accent);color:#fff}.status{margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--muted);text-align:center;font-size:.82rem;font-weight:750}.hidden{display:none!important}

<body data-stip-app="compare">
<main class="shell">
<header class="head"><button class="back" type="button" aria-label="Retour" onclick="location.href='index.html?quick=public'">‹</button><div><span class="kicker">PLANNING · STIP</span><h1>Comparer les plannings</h1><p>Mon planning avec un ou plusieurs agents.</p></div></header>
<section id="picker" class="picker hidden"><div class="picker-top"><strong>Avec qui ?</strong><small id="teamLabel"></small></div><div id="selected" class="selected"></div><label class="search"><span>⌕</span><input id="search" type="search" autocomplete="off" placeholder="Rechercher un agent…"></label><div id="results" class="results"></div><button id="compareBtn" class="compare" type="button" disabled>Comparer</button></section>
<section id="view" class="view hidden"></section><div id="status" class="status">Ouverture des plannings…</div>
</main>
<script>
(()=>{'use strict';const DATA='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-data',ACCESS='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-access',STORE='stip_session_v1',$=s=>document.querySelector(s),selected=new Map();let session=null,spirit=null,agents=[],expanded=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),name=a=>[a?.prenom,a?.nom].filter(Boolean).join(' ').trim()||'Agent';
async function call(url,action){const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-STIP-Session':localStorage.getItem(STORE)||''},body:JSON.stringify({action})}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||`Erreur ${r.status}`);return j}
function paris(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=k=>p.find(x=>x.type===k)?.value||'';return`${g('year')}-${g('month')}-${g('day')}`}
function add(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return paris(d)}function weekStart(){const d=new Date(paris()+'T12:00:00'),n=d.getDay()||7;d.setDate(d.getDate()-n+1);return paris(d)}function weekNo(iso){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+3-((x.getDay()+6)%7));const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/86400000-3+((w1.getDay()+6)%7))/7)}
function rowsFor(a){const key=a?.source_key;return(spirit?.planning||[]).filter(r=>r.agents?.source_key===key)}function mapRows(a){return new Map(rowsFor(a).map(r=>[String(r.date||'').slice(0,10),r]))}
function collectAgents(){const m=new Map();for(const r of spirit?.planning||[]){const a=r.agents||{};if(a.source_key)m.set(a.source_key,a)}agents=[...m.values()].sort((a,b)=>name(a).localeCompare(name(b),'fr',{sensitivity:'base'}))}
function chips(){$('#selected').innerHTML=selected.size?[...selected.values()].map(a=>`<button type="button" data-remove="${esc(a.source_key)}">${esc(name(a))} ×</button>`).join(''):'<span>Aucun agent sélectionné</span>';$('#selected').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);paintPicker()})}
function paintPicker(){chips();const q=norm($('#search').value),self=session?.agent?.source_key,list=q?agents.filter(a=>a.source_key!==self&&!selected.has(a.source_key)&&norm(name(a)).includes(q)).slice(0,25):[];$('#results').innerHTML=q?(list.length?list.map(a=>`<button type="button" data-pick="${esc(a.source_key)}"><span><strong>${esc(name(a))}</strong>${a.ghe?`<small>${esc(a.ghe)}</small>`:''}</span><b>＋</b></button>`).join(''):'<p>Aucun agent trouvé.</p>'):'<p>Tape une lettre pour rechercher.</p>';$('#results').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const a=agents.find(x=>x.source_key===b.dataset.pick);if(a){selected.set(a.source_key,a);$('#search').value='';paintPicker();$('#search').focus()}});$('#compareBtn').disabled=!selected.size;$('#compareBtn').textContent=selected.size>1?`Comparer avec ${selected.size} agents`:'Comparer avec cet agent'}
function day(iso,row){const d=new Date(iso+'T12:00:00'),r=row.get(iso),code=String(r?.code||r?.source_value||'').trim().toUpperCase()||'—',today=iso===paris();return`<div class="day ${today?'today':''}"><div class="day-top"><span>${esc(d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','').toUpperCase())}</span><span>${esc(code)}</span></div><div class="day-body"><b>${d.getDate()}</b><span class="code">${esc(code)}</span></div></div>`}
function stack(a,dates){const row=mapRows(a);let out='',last=-1;dates.forEach((iso,i)=>{const w=weekNo(iso);if(w!==last){out+=`<div class="week">SEMAINE ${w}</div>`;last=w}out+=day(iso,row)});return out}
function render(){if(!selected.size)return;const self=session?.agent||{},cols=[self,...selected.values()],days=expanded?21:7,start=weekStart(),dates=Array.from({length:days},(_,i)=>add(start,i)),canChange=!!session?.permissions?.change_app;$('#picker').classList.add('hidden');$('#view').classList.remove('hidden');$('#view').innerHTML=`<div class="view-head"><div><small>COMPARAISON</small><h2>${cols.length} plannings côte à côte</h2></div><button type="button" id="edit">Modifier</button></div><p class="hint">Glisse horizontalement pour voir les autres agents →</p><div class="scroll"><div class="cols">${cols.map((a,i)=>`<section class="col ${i===0?'mine':''}"><header><small>${i===0?'MON PLANNING':'AGENT'}</small><strong>${esc(i===0?'Moi':name(a))}</strong></header><div class="days">${stack(a,dates)}</div></section>`).join('')}</div></div><div class="actions"><button class="more" id="more" type="button">${expanded?'Réduire':'Voir 3 semaines'}</button>${canChange?'<button class="change" id="change" type="button">Demander un changement</button>':''}</div>`;$('#edit').onclick=()=>{$('#view').classList.add('hidden');$('#picker').classList.remove('hidden');paintPicker()};$('#more').onclick=()=>{expanded=!expanded;render()};$('#change')?.addEventListener('click',()=>location.href='index.html?quick=change')}
async function boot(){const token=localStorage.getItem(STORE)||'';if(!token){location.replace('index.html');return}try{[session,spirit]=await Promise.all([call(ACCESS,'me'),call(DATA,'spirit')]);if(!session?.permissions?.planning_team)throw Error('Comparaison non autorisée.');collectAgents();$('#teamLabel').textContent=spirit.team?`Équipe ${spirit.team}`:'';$('#status').classList.add('hidden');$('#picker').classList.remove('hidden');paintPicker()}catch(e){$('#status').textContent=e.message||'Comparaison indisponible.'}}
$('#search').addEventListener('input',paintPicker);$('#compareBtn').onclick=render;boot()})();
</script>
