<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"><title>Agenda agents · STIP</title><link rel="stylesheet" href="stip-theme.css?v=20260824-master5"></head><body><main class="ag-shell"><header class="ag-head"><button class="ag-back" id="agBack" type="button">‹</button><div><span>RESPONSABLE · STIP</span><h1>Agenda agents</h1><p>Ajoute une information, propose un événement ou envoie seulement une notification.</p></div></header><div class="ag-auto">🎓 Formations et 👶 stagiaires sont ajoutés automatiquement par STIP quand l’agent est concerné.</div><section class="ag-card"><div class="ag-modes"><button class="ag-mode active" data-mode="direct" type="button"><span>📅</span>Ajouter directement</button><button class="ag-mode" data-mode="proposal" type="button"><span>➕</span>Proposer à l’agent</button><button class="ag-mode" data-mode="notify" type="button"><span>🔔</span>Notification uniquement</button></div><form id="agForm"><div class="ag-grid"><div class="ag-field full"><label>AGENT</label><select id="agAgent" required><option value="">Chargement…</option></select></div><div class="ag-field full"><label>TITRE</label><input id="agTitle" maxlength="180" required placeholder="Ex. Réunion d’équipe"></div><div class="ag-field full"><label>MESSAGE</label><textarea id="agBody" maxlength="1500" placeholder="Information utile pour l’agent"></textarea></div><div class="ag-field ag-schedule"><label>DATE</label><input id="agDate" type="date"></div><div class="ag-field ag-schedule"><label>PLACEMENT</labe
