<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"><title>Agenda agents · STIP</title><link rel="stylesheet" href="responsable-style-1.css"><link rel="stylesheet" href="responsable-home.css?v=20260822-final3"><link rel="stylesheet" href="stip-ui.css?v=20260822-final3"><style>:root{--ag-ink:#123f50;--ag-muted:#70858d;--ag-line:#d8e8eb;--ag-bg:#f5fafb;--ag-blue:#1689a5;--ag-orange:#e18826}body{background:var(--ag-bg)!important}.ag-shell{box-sizing:border-box;width:100%;max-width:760px;margin:auto;padding:18px clamp(12px,4vw,22px) 46px}.ag-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.ag-back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;color:var(--ag-ink);font-size:1.5rem;box-shadow:0 6px 18px #153a4a12}.ag-head span{display:block;color:#0798b5;font-size:.63rem;font-weight:950;letter-spacing:.12em}.ag-head h1{margin:3px 0 0;font-size:1.95rem;color:var(--ag-ink)}.ag-head p{margin:6px 0 0;color:var(--ag-muted);font-size:.76rem}.ag-auto{margin-bottom:12px;padding:11px 13px;border-radius:15px;background:#edf8f4;color:#326f60;font-size:.72rem;line-height:1.4}.ag-card{padding:14px;border:1px solid var(--ag-line);border-radius:21px;background:#fff;box-shadow:0 9px 24px rgba(18,72,88,.06)}.ag-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:14px}.ag-mode{min-height:65px;border:1px solid var(--ag-line);border-radius:16px;background:#f8fbfc;color:var(--ag-ink);padding:8px;font-size:.7rem;font-weight:900}.ag-mode span{display:block;font-size:1.2rem;margin-bottom:4px}.ag-mode.active{background:#eaf8fb;border-color:#7bc9d7}.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ag-field{min-width:0}.ag-field.full{grid-column:1/-1}.ag-field label{display:block;margin:0 0 5px 2px;color:#6b8189;font-size:.61rem;font-weight:950;letter-spacing:.06em}.ag-field input,.ag-field select,.ag-field textarea{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #d4e3e6;border-radius:13px;background:#fbfdfe;color:var(--ag-ink);padding:9px 10px;font:inherit}.ag-field textarea{min-height:88px;resize:vertical}.ag-check{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid #d4e3e6;border-radius:13px;background:#fbfdfe;color:var(--ag-ink);font-size:.75rem;font-weight:850}.ag-check input{width:18px;height:18px}.ag-submit{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b8eaa,#20bcd2);color:#fff;font-weight:950;font-size:.83rem}.ag-submit.notify{background:linear-gradient(135deg,#e89b37,#d67818)}.ag-feedback{min-height:20px;margin-top:8px;color:#607a83;font-size:.7rem}.ag-upcoming{margin-top:14px}.ag-upcoming>header{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.ag-upcoming h2{margin:0;color:var(--ag-ink);font-size:1.05rem}.ag-upcoming small{color:var(--ag-muted)}.ag-list{display:grid;gap:7px}.ag-item{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--ag-line);border-radius:15px;background:#fff}.ag-item-icon{width:44px;height:44px;border-radius:13px;background:#edf5f7;display:grid;place-items:center;font-size:1.15rem}.ag-item strong,.ag-item small{display:block}.ag-item strong{color:var(--ag-ink);font-size:.76rem}.ag-item small{margin-top:3px;color:var(--ag-muted);font-size:.63rem;line-height:1.35}.ag-item button{border:0;border-radius:10px;background:#fff0f1;color:#9b4050;padding:8px;font-weight:900}.ag-empty{padding:18px;text-align:center;border:1px dashed #cbdfe3;border-radius:16px;color:var(--ag-muted);font-size:.73rem;background:#fff9}.hidden{display:none!important}@media(max-width:430px){.ag-grid{grid-template-columns:1fr}.ag-field.full{grid-column:auto}.ag-modes{grid-template-columns:1fr}.ag-mode{min-height:52px;text-align:left}.ag-mode span{display:inline;margin-right:7px}.ag-item{grid-template-columns:40px minmax(0,1fr) auto}.ag-item-icon{width:38px;height:38px}}</style></head><body><main class="ag-shell"><header class="ag-head"><button class="ag-back" id="agBack" type="button">‹</button><div><span>RESPONSABLE · STIP</span><h1>Agenda agents</h1><p>Ajoute une information, propose un événement ou envoie seulement une notification.</p></div></header><div class="ag-auto">🎓 Formations et 👶 stagiaires sont ajoutés automatiquement par STIP quand l’agent est concerné.</div><section class="ag-card"><div class="ag-modes"><button class="ag-mode active" data-mode="direct" type="button"><span>📅</span>Ajouter directement</button><button class="ag-mode" data-mode="proposal" type="button"><span>➕</span>Proposer à l’agent</button><button class="ag-mode" data-mode="notify" type="button"><span>🔔</span>Notification uniquement</button></div><form id="agForm"><div class="ag-grid"><div class="ag-field full"><label>AGENT</label><select id="agAgent" required><option value="">Chargement…</option></select></div><div class="ag-field full"><label>TITRE</label><input id="agTitle" maxlength="180" required placeholder="Ex. Réunion d’équipe"></div><div class="ag-field full"><label>MESSAGE</label><textarea id="agBody" maxlength="1500" placeholder="Information utile pour l’agent"></textarea></div><div class="ag-field ag-schedule"><label>DATE</label><input id="agDate" type="date"></div><div class="ag-field ag-schedule"><label>PLACEMENT</label><select id="agDisplay"><option value="event">Créer un événement</option><option value="day_note">Ajouter dans la description du jour</option></select></div><div class="ag-field ag-schedule" id="agAllDayWrap"><label>FORMAT</label><label class="ag-check"><input id="agAllDay" type="checkbox" checked> Toute la journée</label></div><div class="ag-field ag-schedule" id="agStartWrap"><label>DÉBUT</label><input id="agStart" type="time"></div><div class="ag-field ag-schedule" id="agEndWrap"><label>FIN</label><input id="agEnd" type="time"></div><div class="ag-field ag-schedule"><label>LIEU</label><input id="agLocation" maxlength="240" placeholder="Optionnel"></div><div class="ag-field ag-schedule"><label>IMPORTANCE</label><select id="agImportance"><option value="normal">Normale</option><option value="important">Importante</option><option value="urgent">Urgente</option></select></div></div><button class="ag-submit" id="agSubmit" type="submit">Ajouter à son agenda</button><div class="ag-feedback" id="agFeedback"></div></form></section><section class="ag-upcoming"><header><h2>À venir</h2><small id="agCount"></small></header><div class="ag-list" id="agList"><div class="ag-empty">Chargement…</div></div></section></main><script src="responsable-agenda.js?v=20260822-agenda1"></script></body></html>
