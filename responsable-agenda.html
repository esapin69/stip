<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5fbfc">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'">
<title>Agenda équipe · STIP</title>
<link rel="stylesheet" href="stip-theme.css?v=20260824-theme3">
<link rel="stylesheet" href="responsable-agenda.css?v=20260918-premium1">
</head>
<body>
<main class="ta-shell">
  <header class="ta-head">
    <button class="ta-round" id="taBack" type="button" aria-label="Retour">‹</button>
    <div class="ta-title">
      <h1>Agenda équipe</h1>
      <p>Toute l’activité utile de l’équipe en un coup d’œil</p>
    </div>
    <button class="ta-round ta-search-toggle" id="taSearchToggle" type="button" aria-label="Rechercher">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
    </button>
  </header>

  <div class="ta-search" id="taSearchWrap" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
    <input id="taSearch" type="search" autocomplete="off" placeholder="Rechercher un agent, une formation, un lieu…">
    <button id="taSearchClear" type="button" aria-label="Effacer">×</button>
  </div>

  <section class="ta-hero" aria-live="polite">
    <span class="ta-hero-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
    </span>
    <div>
      <strong id="taUpcoming">— à venir</strong>
      <p><b id="taWeekCount">—</b> cette semaine <i>•</i> <b id="taMonthCount">—</b> ce mois</p>
    </div>
    <span class="ta-hero-arrow">›</span>
  </section>

  <nav class="ta-tabs" aria-label="Filtrer l’agenda">
    <button type="button" data-filter="all" class="active">Tout <b id="countAll">0</b></button>
    <button type="button" data-filter="medical">Visites <b id="countMedical">0</b></button>
    <button type="button" data-filter="intern">Stagiaires <b id="countIntern">0</b></button>
    <button type="button" data-filter="training">Formations <b id="countTraining">0</b></button>
  </nav>

  <section class="ta-week" id="taWeek" aria-label="Semaine"></section>

  <section class="ta-timeline" id="taTimeline">
    <div class="ta-empty">Chargement de l’agenda…</div>
  </section>
</main>

<button class="ta-add" id="taAdd" type="button" aria-label="Ajouter un élément">+</button>

<section class="ta-sheet" id="taDetailSheet" aria-hidden="true">
  <div class="ta-sheet-card">
    <header>
      <button type="button" data-close-sheet aria-label="Fermer">×</button>
      <div>
        <small id="taDetailType">ÉVÉNEMENT</small>
        <h2 id="taDetailTitle">Détail</h2>
      </div>
    </header>
    <div id="taDetailBody"></div>
  </div>
</section>

<section class="ta-sheet ta-add-sheet" id="taAddSheet" aria-hidden="true">
  <div class="ta-sheet-card">
    <header>
      <button type="button" data-close-add aria-label="Fermer">×</button>
      <div>
        <small>AGENDA ÉQUIPE</small>
        <h2>Ajouter</h2>
      </div>
    </header>
    <div class="ta-mode-tabs">
      <button class="active" data-mode="direct" type="button">Ajouter</button>
      <button data-mode="proposal" type="button">Proposer</button>
      <button data-mode="notify" type="button">Notifier</button>
    </div>
    <form id="taForm" class="ta-form">
      <label>Agent<select id="taAgent" required><option value="">Chargement…</option></select></label>
      <label>Titre<input id="taTitle" maxlength="180" required placeholder="Ex. Réunion d’équipe"></label>
      <label>Message<textarea id="taBody" maxlength="1500" placeholder="Information utile pour l’agent"></textarea></label>
      <div class="ta-form-grid ta-schedule">
        <label>Date<input id="taDate" type="date"></label>
        <label>Placement<select id="taDisplay"><option value="event">Créer un événement</option><option value="day_note">Description du jour</option></select></label>
        <label id="taAllDayWrap">Format<span class="ta-check"><input id="taAllDay" type="checkbox" checked> Toute la journée</span></label>
        <label id="taStartWrap">Début<input id="taStart" type="time"></label>
        <label id="taEndWrap">Fin<input id="taEnd" type="time"></label>
        <label>Lieu<input id="taLocation" maxlength="240" placeholder="Optionnel"></label>
        <label>Importance<select id="taImportance"><option value="normal">Normale</option><option value="important">Importante</option><option value="urgent">Urgente</option></select></label>
      </div>
      <button class="ta-submit" id="taSubmit" type="submit">Ajouter à son agenda</button>
      <p class="ta-feedback" id="taFeedback"></p>
    </form>
  </div>
</section>

<script src="responsable-agenda.js?v=20260918-premium1"></script>
</body>
</html>
