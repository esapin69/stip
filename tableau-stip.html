<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d42">
  <meta name="robots" content="noindex,nofollow">
  <title>Fauteuils STIP</title>
  <link rel="manifest" href="/tableau-stip.webmanifest?v=3">
  <link rel="icon" type="image/svg+xml" href="/images/icone_app/tableau-stip.svg">
  <link rel="apple-touch-icon" href="https://yzsrmuxghlengnkyphxj.supabase.co/storage/v1/object/public/stip-public-assets/branding/native/stip-icon-192.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#f3f7f6;color:#173e4b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .card{width:min(360px,100%);padding:24px 20px 18px;border:1px solid #dbe7e3;border-radius:24px;background:#fff;box-shadow:0 16px 38px rgba(15,55,45,.09);text-align:center}
    .icon{width:78px;height:78px;margin:auto;border-radius:20px;box-shadow:0 8px 20px rgba(11,79,69,.15)}
    h1{margin:14px 0 5px;font-size:1.2rem}
    p{margin:0 0 17px;color:#60736e;font-size:.78rem;line-height:1.4}
    .open{min-height:48px;border-radius:14px;background:#176f7d;color:#fff;font:inherit;font-size:.84rem;font-weight:900;text-decoration:none;display:grid;place-items:center}
    .shortcut{margin:12px auto 0;padding:5px 7px;border:0;background:transparent;color:#5c747b;font:inherit;font-size:.68rem;font-weight:800;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
    .shortcut[hidden]{display:none}
    .hint{min-height:0;margin-top:5px;color:#71858b;font-size:.65rem;line-height:1.35}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/images/icone_app/tableau-stip.svg" alt="">
    <h1>Fauteuils</h1>
    <p>Accès direct aux signalements de fauteuils du jour.</p>
    <a class="open" href="/?quick=tableau">Ouvrir Fauteuils</a>
    <button id="shortcutBtn" class="shortcut" type="button">Ajouter un raccourci au téléphone</button>
    <div class="hint" id="hint" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const KEY="stip_tableau_shortcut_installed_v1";
      const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
      if(standalone){location.replace("/?quick=tableau");return}

      const btn=document.getElementById("shortcutBtn");
      const hint=document.getElementById("hint");
      let promptEvent=null;

      const installed=()=>{try{return localStorage.getItem(KEY)==="1"}catch{return false}};
      const markInstalled=()=>{try{localStorage.setItem(KEY,"1")}catch{};btn.hidden=true;hint.textContent=""};

      if(installed()) btn.hidden=true;

      addEventListener("beforeinstallprompt",(event)=>{
        event.preventDefault();
        promptEvent=event;
        if(!installed()) btn.hidden=false;
      });

      btn.addEventListener("click",async()=>{
        if(promptEvent){
          const event=promptEvent;
          promptEvent=null;
          await event.prompt();
          const choice=await event.userChoice.catch(()=>null);
          if(choice?.outcome==="accepted"){markInstalled();return}
          hint.textContent="";
          return;
        }
        hint.textContent="Chrome : menu ⋮ → Ajouter à l’écran d’accueil.";
      });

      addEventListener("appinstalled",markInstalled);
    })();
  </script>
</body>
</html>
