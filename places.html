<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6fbfc">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex,nofollow">
  <title>Connaître les lieux</title>
  <link rel="icon" type="image/png" sizes="64x64" href="https://yzsrmuxghlengnkyphxj.supabase.co/storage/v1/object/public/stip-public-assets/branding/native/stip-icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://yzsrmuxghlengnkyphxj.supabase.co/storage/v1/object/public/stip-public-assets/branding/native/stip-icon-180.png">
  <link rel="stylesheet" href="stip-theme.css?v=20260824-theme3">
  <link rel="stylesheet" href="places.css?v=20260828-spatial1">
  <link rel="stylesheet" href="places-orientation.css?v=20260829-glance1">
  <link rel="stylesheet" href="places-visit.css?v=20260829-hlpsides1">
  <link rel="stylesheet" href="places-docs.css?v=20260827-visual1">
  <link rel="stylesheet" href="places-terrain.css?v=20260829-readability1">
  <link rel="stylesheet" href="places-pro-elevator.css?v=20260829-prolift2">
  <link rel="stylesheet" href="places-floor-rail.css?v=20260829-floorrail6">
</head>
<body>
  <main class="places-shell" id="placesApp">
    <header class="places-topbar">
      <button id="placesBack" class="places-back" type="button" aria-label="Retour">‹</button>
      <button id="placesHome" class="places-brand" type="button" aria-label="Accueil de Connaître les lieux">
        <span class="places-brand-mark">GHE</span>
        <span>Connaître les lieux</span>
      </button>
      <span aria-hidden="true"></span>
    </header>

    <section class="places-hero">
      <span id="placesKicker" class="stip-kicker">VISITE GUIDÉE DU GHE</span>
      <h1 id="placesHeroTitle">Trouver un lieu</h1>
      <p id="placesHeroText">Service, unité, étage, bâtiment, examen, entrée, ascenseur ou repère terrain.</p>
      <label class="places-search-wrap" for="placesSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="placesSearch" type="search" autocomplete="off" enterkeyhint="search" placeholder="Ex. 301, POP, med nuc, néonat…" aria-label="Rechercher un lieu">
        <button id="placesClear" type="button" aria-label="Effacer la recherche">×</button>
      </label>
    </section>

    <section id="placesStatus" class="places-status" aria-live="polite">Chargement des lieux…</section>
    <section id="placesContent" class="places-content" aria-live="polite"></section>
  </main>

  <script src="places.js?v=20260828-standalone2"></script>
  <script src="places-orientation.js?v=20260829-glance1"></script>
  <script src="places-pro-elevator.js?v=20260829-prolift3"></script>
  <script src="places-hfme-colors.js?v=20260829-hlpsides1"></script>
  <script src="places-visit-navigation.js?v=20260829-glance1"></script>
  <script src="places-elevator-stops.js?v=20260829-compact1"></script>
  <script src="places-docs.js?v=20260827-visual1"></script>
  <script src="places-route-placement.js?v=20260827-1"></script>
  <script src="places-terrain.js?v=20260829-exams2"></script>
  <script src="places-floor-rail.js?v=20260829-floorrail6"></script>
  <script src="stip-navigation.js?v=20260828-nav1"></script>
</body>
</html>
