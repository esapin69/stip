<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5fbfc" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Date des agents · STIP</title>
    <link rel="stylesheet" href="stip-theme.css?v=20260922-sections3" />
    <link rel="stylesheet" href="agent-dates.css?v=20260922-dayfilter1" />
  </head>
  <body>
    <main class="da-shell">
      <header class="da-head">
        <button id="daBack" class="da-round" type="button" aria-label="Retour">
          ‹
        </button>
        <div>
          <h1>Date des agents</h1>
          <p>Toutes les dates utiles de l’équipe en un coup d’œil</p>
        </div>
        <button
          id="daSearchBtn"
          class="da-round da-search-btn"
          type="button"
          aria-label="Rechercher"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6" />
            <path d="m16 16 4 4" />
          </svg>
        </button>
      </header>
      <div class="da-search" id="daSearchWrap" hidden>
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6" />
          <path d="m16 16 4 4" /></svg
        ><input
          id="daSearch"
          type="search"
          placeholder="Rechercher un agent, une formation, un lieu…"
        /><button id="daClear" type="button">×</button>
      </div>
      <section class="da-hero">
        <span class="da-hero-icon"
          ><svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="3" />
            <path d="M8 3v4M16 3v4M3 10h18" /></svg
        ></span>
        <div>
          <strong id="daUpcoming">— à venir</strong>
          <p>
            <b id="daWeekCount">—</b> cette semaine <i>•</i>
            <b id="daMonthCount">—</b> ce mois
          </p>
        </div>
        <span>›</span>
      </section>
      <nav class="da-tabs">
        <button data-filter="all" class="active">Tout</button
        ><button data-filter="medical">Visites</button
        ><button data-filter="intern">Stagiaires</button
        ><button data-filter="training">Formations</button>
      </nav>
      <div class="da-scope" id="daScope" hidden>
        <span id="daScopeText"></span>
        <button id="daScopeClear" type="button">Voir toutes les dates</button>
      </div>
      <div class="stip-section-separator"><span>DATES À VENIR</span></div>
      <section class="da-list" id="daList">
        <div class="da-empty">Chargement…</div>
      </section>
    </main>
    <section class="da-sheet" id="daSheet" aria-hidden="true">
      <div class="da-sheet-card">
        <header>
          <button id="daSheetClose" type="button">×</button>
          <div>
            <small id="daDetailType">ÉVÉNEMENT</small>
            <h2 id="daDetailName">Détail</h2>
          </div>
        </header>
        <div id="daDetailBody"></div>
      </div>
    </section>
    <script src="stip-navigation.js?v=20260920-context2"></script>
    <script src="agent-dates.js?v=20260922-dayfilter1"></script>
  </body>
</html>
