<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#8d4b70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>STIP — Test réel</title>
<link rel="stylesheet" href="test.css?v=20260819-real1">
</head>
<body data-wallpaper="sunset">
  <header class="test-bar">
    <a class="back" href="index.html" aria-label="Revenir à STIP">‹ <strong>STIP</strong></a>
    <span class="test-badge">TEST RÉEL</span>
  </header>

  <main class="shell" id="shell">
    <section class="wallpaper" id="wallpaper">
      <div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grain"></div>

      <section class="home" id="home">
        <div class="hero-row">
          <div>
            <span class="eyebrow">ESPACE PERSONNEL</span>
            <h1 id="hello">Bonjour</h1>
            <p id="connectionState">Connexion aux données STIP…</p>
          </div>
          <button class="palette" id="paletteBtn" type="button" aria-label="Changer le fond">◌</button>
        </div>

        <section class="widget widget-main" id="todayWidget" tabindex="0" role="button" aria-label="Ouvrir mon planning">
          <div class="date-tile"><strong id="todayDay">19</strong><span id="todayMonth">AOÛT</span></div>
          <div class="widget-copy">
            <small id="todayKicker">AUJOURD’HUI</small>
            <strong id="todayTitle">Chargement du planning…</strong>
            <span id="todaySub">Données réelles si ta session STIP est active.</span>
          </div>
          <span class="chev">›</span>
        </section>

        <section class="mini-widgets" id="miniWidgets">
          <button class="mini-widget" data-open="personal"><small>PROCHAIN SERVICE</small><strong id="nextShift">—</strong><span id="nextShiftDate">Recherche…</span></button>
          <button class="mini-widget" data-open="team"><small>ÉQUIPE</small><strong id="teamCount">—</strong><span id="teamLabel">Aujourd’hui</span></button>
        </section>

        <div class="apps-title">
          <span>Mes applications</span>
          <button id="editBtn" type="button">Modifier</button>
          <button id="doneBtn" type="button" hidden>Terminé</button>
        </div>

        <div class="apps" id="apps" aria-label="Applications STIP"></div>

        <div class="pager"><span class="dot active"></span><span class="dot"></span></div>

        <div class="dock" id="dock" aria-label="Favoris"></div>
      </section>

      <section class="panel" id="panel" aria-hidden="true">
        <header class="panel-head">
          <button id="panelBack" type="button" aria-label="Retour">‹</button>
          <div><small id="panelKicker">STIP</small><h2 id="panelTitle">Application</h2></div>
          <button id="panelRefresh" type="button" aria-label="Actualiser">↻</button>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </section>

      <section class="sheet" id="wallpaperSheet" aria-hidden="true">
        <div class="handle"></div>
        <div class="sheet-head"><div><small>APPARENCE</small><h3>Fond STIP</h3></div><button data-close-sheet type="button">×</button></div>
        <div class="wallpapers">
          <button data-wall="sunset"><i class="w-sunset"></i><span>Soleil</span></button>
          <button data-wall="aurora"><i class="w-aurora"></i><span>Aurore</span></button>
          <button data-wall="forest"><i class="w-forest"></i><span>Forêt</span></button>
          <button data-wall="night"><i class="w-night"></i><span>Nuit</span></button>
        </div>
      </section>
      <div class="backdrop" id="backdrop" hidden></div>
      <div class="toast" id="toast"></div>
    </section>
  </main>
<script src="test.js?v=20260819-real1"></script>
</body>
</html>
