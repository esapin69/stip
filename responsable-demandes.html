<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Demandes · Responsable STIP</title><link rel="stylesheet" href="responsable-style-1.css"><link rel="stylesheet" href="responsable-style-4.css"><style>.req{max-width:620px;margin:18px auto;padding:0 14px}.req .card{background:#fff;border:1px solid #d7e8ec;border-radius:20px;padding:16px}.req label{display:grid;gap:6px;margin:10px 0;color:#667b85;font-weight:800;font-size:.86rem}.req input,.req select,.req textarea{width:100%;padding:12px;border:1px solid #cfdfe3;border-radius:13px;background:#fbfeff;color:#123444}.req textarea{min-height:110px}.req button{width:100%;min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,#0798b5,#19bfd8);color:#fff;font-weight:950}.req .status{margin-top:10px}.req .agent-list{display:grid;gap:7px;margin-top:8px}.req .agent-option{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border:1px solid #d7e8ec;border-radius:12px;background:#fff;color:#123444;text-align:left}.req .agent-option.selected{border-color:#19bfd8;background:#effbfe}.mode-note{padding:10px 12px;border-radius:12px;background:#f0f8fa;color:#526f79;font-size:.78rem}</style></head><body><header class="top"><div class="brand"><b>STIP</b> · RESPONSABLE</div><a class="home" href="responsable.html">Retour</a></header><main class="req"><section class="card"><h1>Envoyer</h1><p>Une action reste dans le carousel de l’agent jusqu’à son traitement. Un message libre va uniquement dans ses notifications.</p><label>Rechercher un agent<input id="search" placeholder="Nom ou prénom"></label><div class="agent-list" id="agents"></div><form id="form" hidden><input type="hidden" id="agentId"><label>Type<select id="kind"><option value="request">Demande</option><option value="validation">Validation</option><option value="read">Information à
