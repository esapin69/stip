<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Demandes · Responsable STIP</title><link rel="stylesheet" href="stip-theme.css?v=20260824-master5"></head><body><header class="stip-topbar"><div class="stip-topbar-brand"><b>STIP</b><span>RESPONSABLE</span></div><a href="responsable.html">Retour</a></header><main class="req"><section class="card"><span class="stip-kicker">RESPONSABLE · STIP</span><h1>Envoyer</h1><p>Une action reste visible chez l’agent jusqu’à son traitement. Un message libre va uniquement dans ses notifications.</p><label>Rechercher un agent<input id="search" class="stip-input" placeholder="Nom ou prénom"></label><div class="agent-list" id="agents"></div><form id="form" hidden><input type="hidden" id="agentId"><label>Type<select id="kind"><option value="request">Demande</option><option value="validation">Validation</option><option value="read">Information à lire</option><option value="document">Document à compléter</option><option value="notification">Message libre · notification seulement</option></select></label><div class="mode-note" id="modeNote">Cette demande apparaîtra dans le carousel de l’agent jusqu’à son traitement.</div><label>Titre<input id="title" maxlength="180" required placeholder="Ex. Lire la nouvelle procédure"></label><label>Message<textarea id="body" maxlength="1500" placeholder="Écris ton message"></textarea></label><label id="priorityLabel">Priorité<select id="priority"><option value="50">Normale</option><option value="75">Importante</option><option value="95">Urgente</option></select></label><button type="submit" id="sendBtn">Envoyer dans STIP</button><div class="status" id="status"></div></form></section></main><script src="name-format.js?v=20260820-global2"></script><script src="responsable-base.js"></script><script src="responsable-demandes.js?v=20260820-notif1"></script></body></html>
