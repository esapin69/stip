<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Esprit d’équipe · STIP</title>
    <link rel="stylesheet" href="stip-theme.css?v=20260920-timefilter1" />
    <link rel="stylesheet" href="stip-shell.css?v=20260920-reprise1" />
    <link rel="stylesheet" href="esprit-equipe.css?v=20260921-field1" />
  </head>
  <body class="team-page">
    <header class="team-top">
      <button
        type="button"
        data-stip-back
        data-back-fallback="index.html"
        aria-label="Retour"
      >
        ‹
      </button>
      <div><b>STIP</b><span>ESPRIT D’ÉQUIPE</span></div>
      <button id="teamRefresh" type="button" aria-label="Actualiser">↻</button>
    </header>
    <main class="team-shell">
      <section class="team-heading">
        <span class="stip-kicker">VUE RÉUNIE</span>
        <h1>Esprit d’équipe</h1>
        <p>
          Le planning équipe, l’activité et l’assistant réunis sans mélanger
          leurs rôles.
        </p>
        <button id="teamSubscribe" class="team-calendar-subscribe" type="button" hidden>
          <span>📅</span><strong>Calendrier équipe</strong>
        </button>
      </section>
      <section class="team-time-stack stip-time-stack" aria-label="Navigation temporelle">
        <section
          id="teamDateJumpPanel"
          class="team-date-jump-panel team-date-jump-permanent"
          aria-label="Calendrier mensuel"
        ></section>
        <nav
          id="teamDays"
          class="team-days stip-time-days"
          aria-label="Accéder directement à une journée"
        ></nav>
        <nav class="team-tabs stip-levels" role="tablist" aria-label="Volets Esprit d’équipe">
          <button type="button" role="tab" aria-selected="true" class="active" data-team-tab="team">Équipe</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="activity">Activité</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="assistant">Assistant</button>
        </nav>
      </section>
      <p id="teamError" class="team-error" role="status" aria-live="polite"></p>
      <section
        id="teamContent"
        class="team-content"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="team-week-skeleton" aria-label="Chargement de la journée sélectionnée">
          <i></i>
        </div>
      </section>
    </main>
    <script src="stip-navigation.js?v=20260920-context1"></script>
    <script src="stip-field-intelligence.js?v=20260921-field1"></script>
    <script src="agent-agenda-view.js?v=20260921-calgrid3"></script>
    <script src="calendar-subscriptions.js?v=20260921-calfeed2"></script>
    <script src="esprit-equipe.js?v=20260921-field1"></script>
  </body>
</html>
