<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Esprit d’équipe · STIP</title>
    <link rel="stylesheet" href="stip-theme.css?v=20260920-timefilter1" />
    <link rel="stylesheet" href="stip-shell.css?v=20260920-reprise1" />
    <link rel="stylesheet" href="esprit-equipe.css?v=20260921-agentagenda2" />
  </head>
  <body class="team-page">
    <header class="team-top">
      <button
        type="button"
        data-stip-back
        data-back-fallback="index.html"
        aria-label="Retour"
      >
        ‹
      </button>
      <div><b>STIP</b><span>ESPRIT D’ÉQUIPE</span></div>
      <button id="teamRefresh" type="button" aria-label="Actualiser">↻</button>
    </header>
    <main class="team-shell">
      <section class="team-heading">
        <span class="stip-kicker">VUE RÉUNIE</span>
        <h1>Esprit d’équipe</h1>
        <p>
          Le planning équipe, l’activité et l’assistant réunis sans mélanger
          leurs rôles.
        </p>
      </section>
      <section class="team-time-stack stip-time-stack" aria-label="Navigation temporelle">
        <section class="stip-time-month team-time-month" aria-label="Mois affiché">
          <div class="stip-time-month-head">
            <span class="stip-time-month-kicker">ESPRIT D’ÉQUIPE · <b id="teamYearLabel">2026</b></span>
            <button id="teamCurrent" class="stip-time-month-action" type="button">Aujourd’hui</button>
          </div>
          <strong id="teamMonthLabel" class="stip-time-month-title">SEPTEMBRE</strong>
        </section>
        <section class="team-week-nav stip-time-nav stip-time-week" aria-label="Changer de semaine">
          <button id="teamPrev" type="button" aria-label="Semaine précédente">‹</button>
          <button id="teamToday" type="button" aria-controls="teamDateJumpPanel" aria-expanded="false" aria-label="Ouvrir le calendrier">
            <strong id="teamDateLabel">Cette semaine</strong>
            <small id="teamWeekLabel">Semaine en cours</small>
          </button>
          <button id="teamNext" type="button" aria-label="Semaine suivante">›</button>
        </section>
        <div id="teamDateJumpPanel" class="team-date-jump-panel" hidden></div>
        <nav
          id="teamDays"
          class="team-days stip-time-days"
          aria-label="Accéder directement à une journée"
        ></nav>
        <nav class="team-tabs stip-levels" role="tablist" aria-label="Volets Esprit d’équipe">
          <button type="button" role="tab" aria-selected="true" class="active" data-team-tab="team">Équipe</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="activity">Activité</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="assistant">Assistant</button>
        </nav>
      </section>
      <p id="teamError" class="team-error" role="status" aria-live="polite"></p>
      <section
        id="teamContent"
        class="team-content"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="team-week-skeleton" aria-label="Chargement de la journée sélectionnée">
          <i></i>
        </div>
      </section>
    </main>
    <script src="stip-navigation.js?v=20260920-context1"></script>
    <script src="agent-agenda-view.js?v=20260921-sharedmonth2"></script>
    <script src="esprit-equipe.js?v=20260921-agentagenda2"></script>
  </body>
</html>
