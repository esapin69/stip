<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Esprit d’équipe · STIP</title>
    <link rel="stylesheet" href="stip-theme.css?v=20260922-sections3" />
    <link rel="stylesheet" href="stip-shell.css?v=20260920-reprise1" />
    <link rel="stylesheet" href="esprit-equipe.css?v=20260922-statusspace1" />
  </head>
  <body class="team-page">
    <header class="team-top">
      <button
        type="button"
        data-stip-back
        data-back-fallback="index.html"
        aria-label="Retour"
      >
        ‹
      </button>
      <div><b>STIP</b><span>ESPRIT D’ÉQUIPE</span></div>
      <button id="teamRefresh" type="button" aria-label="Actualiser">↻</button>
    </header>
    <main class="team-shell">
      <section id="teamDutyChiefHost" class="team-duty-chief-host" aria-label="Chef d’équipe présent"></section>
      <section id="teamWeekControls" class="team-time-stack stip-time-stack" aria-label="Semaine active">
        <div class="team-week-section-label stip-section-separator" aria-hidden="true"><span>SEMAINE ACTIVE</span></div>
        <nav
          id="teamDays"
          class="team-days stip-time-days"
          aria-label="Accéder directement à une journée"
        ></nav>
        <nav class="team-tabs stip-levels" role="tablist" aria-label="Volets Esprit d’équipe">
          <button type="button" role="tab" aria-selected="true" class="active" data-team-tab="team">Équipe</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="activity">Activité</button>
          <button type="button" role="tab" aria-selected="false" data-team-tab="assistant">Assistant</button>
        </nav>
      </section>
      <p id="teamError" class="team-error" role="status" aria-live="polite"></p>
      <section
        id="teamContent"
        class="team-content"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="team-week-skeleton" aria-label="Chargement de la journée sélectionnée">
          <i></i>
        </div>
      </section>

      <section class="team-month-zone" aria-label="Vue mensuelle Esprit d’équipe">
        <div class="team-month-separator stip-section-separator" aria-hidden="true"><span>AU MOIS</span></div>
        <section
          id="teamDateJumpPanel"
          class="team-date-jump-panel team-date-jump-permanent"
          aria-label="Calendrier mensuel"
        ></section>

        <section
          id="teamDateExplanation"
          class="team-date-explanation status-unknown"
          aria-live="polite"
          hidden
        ></section>

        <div class="team-legend-separator stip-section-separator" aria-hidden="true">
          <span>LÉGENDE DU MOIS</span>
        </div>
        <section class="team-month-legend stip-legend-surface" aria-label="Légende du mois">
          <div>
            <span><i class="status-ok" aria-hidden="true">✔</i><b>Rien ne coince</b></span>
            <span><i class="status-warning" aria-hidden="true">⚠</i><b>À surveiller</b></span>
            <span><i class="status-critical" aria-hidden="true">🛑</i><b>Ça coince</b></span>
            <span><i class="status-unknown" aria-hidden="true">○</i><b>Pas encore analysé</b></span>
          </div>
        </section>

        <details class="stip-option-pocket" data-stip-option="calendar-team">
          <summary class="stip-option-summary"><span aria-hidden="true">⋯</span> Options du planning</summary>
          <div class="stip-option-pocket-body">
            <button id="teamSubscribe" class="stip-option-action" type="button" hidden>
              <span aria-hidden="true">📅</span>
              <strong>S’abonner au calendrier équipe</strong>
              <small>Synchronisation avec le calendrier du téléphone</small>
              <b aria-hidden="true">›</b>
            </button>
          </div>
        </details>
      </section>
    </main>
    <script src="stip-navigation.js?v=20260920-context1"></script>
    <script src="stip-field-intelligence.js?v=20260921-field3"></script>
    <script src="agent-agenda-view.js?v=20260922-headercall1"></script>
    <script src="calendar-subscriptions.js?v=20260921-calfeed2"></script>
    <script src="home-duty-chief.js?v=20260922-chiefrow2"></script>
    <script src="esprit-equipe.js?v=20260922-shiftstatus2"></script>
  </body>
</html>
