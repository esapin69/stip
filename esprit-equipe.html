<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://yzsrmuxghlengnkyphxj.supabase.co; img-src 'self' data: https://yzsrmuxghlengnkyphxj.supabase.co; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Esprit d’équipe · STIP</title>
    <link rel="stylesheet" href="stip-theme.css?v=20260922-opportunity1" />
    <link rel="stylesheet" href="stip-shell.css?v=20260920-reprise1" />
    <link data-agent-agenda-css rel="stylesheet" href="agent-agenda-view.css?v=20260924-home-week-model3" />
    <link rel="stylesheet" href="esprit-equipe.css?v=20260924-todayseparator1" />
  </head>
  <body class="team-page">
    <header class="team-top">
      <button
        type="button"
        id="teamStandaloneBack"
        data-back-fallback="index.html#/team"
        aria-label="Retour"
      >
        ‹
      </button>
      <div><b>STIP</b><span>ESPRIT D’ÉQUIPE</span></div>
      <button id="teamRefresh" type="button" aria-label="Actualiser">↻</button>
    </header>
    <main class="team-shell">
      <section class="team-page-title" aria-labelledby="teamPageTitle">
        <h1 id="teamPageTitle">Esprit d’équipe</h1>
      </section>

      <section class="team-live-zone" aria-label="Chefs et informations du jour">
        <div class="stip-section-separator team-today-separator" aria-hidden="true">
          <span>AUJOURD’HUI</span>
        </div>

        <section id="teamDutyChiefTodayHost" class="team-duty-chief-host" aria-label="Chefs d’équipe de la journée"></section>

      </section>

      <p id="teamError" class="team-error" role="status" aria-live="polite"></p>
      <section
        id="teamContent"
        class="team-content"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="team-week-skeleton" aria-label="Chargement de la journée sélectionnée">
          <i></i>
        </div>
      </section>

      <section class="team-month-zone team-month-zone-secondary" aria-label="Calendrier, synthèse mensuelle, repères et options">
        <div class="team-calendar-section-label stip-section-separator" aria-hidden="true">
          <span>CE MOIS</span>
        </div>

        <section
          id="teamDateJumpPanel"
          class="team-date-jump-panel team-date-jump-permanent"
          aria-label="Calendrier mensuel — choisir une journée"
        ></section>

        <div class="team-month-digest-separator stip-section-separator" aria-hidden="true">
          <span>À RETENIR CE MOIS</span>
        </div>
        <section id="teamMonthDigestHost" class="team-month-digest-host" aria-live="polite"></section>

        <div class="team-legend-separator stip-section-separator" aria-hidden="true">
          <span>LÉGENDE</span>
        </div>
        <section class="team-month-legend stip-legend-surface" aria-label="Légende des repères de la page">
          <div>
            <span><i class="status-ok" aria-hidden="true">✔</i><b>Rien ne coince</b></span>
            <span><i class="status-warning" aria-hidden="true">⚠</i><b>À surveiller</b></span>
            <span><i class="status-critical" aria-hidden="true">🛑</i><b>Journée tendue</b></span>
            <span><i class="status-opportunity" aria-hidden="true">+</i><b>Présence plus large</b></span>
            <span><i class="status-unknown" aria-hidden="true">○</i><b>Pas encore analysé</b></span>
            <span><i aria-hidden="true">🎨</i><b>Chef d’équipe</b></span>
            <span><i aria-hidden="true">⏱</i><b>Horaire adapté</b></span>
            <span><i aria-hidden="true">◐</i><b>Temps partiel</b></span>
            <span><i aria-hidden="true">🎓</i><b>Formation</b></span>
            <span><i aria-hidden="true">👶</i><b>Stagiaire</b></span>
          </div>
        </section>

        <details class="stip-option-pocket" data-stip-option="calendar-team">
          <summary class="stip-option-summary"><span aria-hidden="true">⋯</span> Options du planning</summary>
          <div class="stip-option-pocket-body">
            <button id="teamSubscribe" class="stip-option-action" type="button" hidden>
              <span aria-hidden="true">📅</span>
              <strong>S’abonner au calendrier équipe</strong>
              <small>Synchronisation avec le calendrier du téléphone</small>
              <b aria-hidden="true">›</b>
            </button>
          </div>
        </details>
      </section>
    </main>
    <script src="stip-navigation.js?v=20260924-history1"></script>
    <script src="stip-field-intelligence.js?v=20260922-field6"></script>
    <script src="agent-agenda-view.js?v=20260924-home-week-model3"></script>
    <script src="calendar-subscriptions.js?v=20260922-agentplanning1"></script>
    <script src="home-duty-chief.js?v=20260924-team-load1"></script>
    <script src="esprit-equipe.js?v=20260924-team-load1"></script>
  </body>
</html>
