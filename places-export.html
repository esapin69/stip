 <main><p>Ouverture de ton PDF Visiter les lieux…</p><a href="places.html">Retour à Visiter les lieux</a></main>
 <script>
 (() => {
   "use strict";
   // Compatibility only. Visitor/pro choice is canonical on places.html.
   // Never restore the obsolete 3-step content/format/action export wizard.
   const choice=new URLSearchParams(location.search).get("audience");
   const audience=choice==="visitor"||choice==="pro"?choice:"choose";
   const target=new URL("places.html",location.href);
   target.searchParams.set("pdf",audience);
   location.replace(target.href);
 })();
 </script>
