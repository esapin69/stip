name: Service app pages
on:
  push:
    paths:
      - '.github/workflows/service-app-pages.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/service_app_pages.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'class="service-app-grid"' places.html
          grep -q "Téléphone public" places.html
          grep -q "Contacts strictement internes" places.html
          ! grep -q "Prendre rendez-vous" places.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('places.html').read_text()
          for i,x in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
            f=Path(tempfile.gettempdir())/f'places-{i}.js';f.write_text(x);subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'STIP service pages'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Redesign service pages as app-style guides'
          git push
