name: Hide public missing content
on:
  push:
    paths:
      - '.github/workflows/hide-public-missing.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/hide_public_missing.py
      - name: Validate
        run: |
          git diff --check
          ! grep -q 'Présentation du service à compléter' places.html
          ! grep -q 'Contact public à compléter' places.html
          ! grep -q 'Information en cours de préparation' places.html
          grep -q "À compléter" places.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('places.html').read_text()
          for i,x in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
            f=Path(tempfile.gettempdir())/f'places-clean-{i}.js';f.write_text(x);subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'STIP service pages'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Hide missing service data from public view'
          git push
