name: Finalize places visual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-places-visual.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize places visual
        env:
          CSS_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('stip-theme.css?v=20260824-theme3','stip-theme.css?v=20260830-places-photo2')
          css=base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          marker='    /* STIP_SERVICE_FICHE_V1 */'
          if 'STIP_PLACES_BLUE_PHOTO_FINAL_V1' not in s:
              s=s.replace(marker,css+'\n'+marker)
          needle='detail.innerHTML=`<a class="detail-back" href="#">‹ Retour à Visiter les lieux</a><article class="detail-hero">'
          repl="const hospitalHeroClass=id==='hfme'?' hospital-photo-hero hospital-photo-hfme':id==='pw'?' hospital-photo-hero hospital-photo-pw':(id==='hlp'||id==='lp')?' hospital-photo-hero hospital-photo-hlp':'';detail.innerHTML=`<a class=\"detail-back\" href=\"#\">‹ Retour à Visiter les lieux</a><article class=\"detail-hero${hospitalHeroClass}\">"
          if needle in s and 'const hospitalHeroClass=' not in s:
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalise les photos et le bleu de Visiter les lieux"
          git push
