name: STIP design contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  design-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-wire STIP continuity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node tools/stip-continuity-autofix.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Auto-wire STIP continuity [skip ci]"
            git push
          fi

      - name: Check STIP visual contract
        run: node tools/stip-design-audit.mjs

      - name: Check STIP refactor invariants
        run: node tools/stip-refactor-test.mjs
