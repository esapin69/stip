name: STIP meeting notes contract

on:
  push:
    branches: [main]
    paths:
      - 'meeting-notes.html'
      - 'meeting-notes.css'
      - 'meeting-notes.js'
      - 'meeting-runtime.css'
      - 'meeting-runtime.js'
      - 'index.html'
      - 'access-runtime.js'
      - 'quick-access.js'
      - 'quick-access-universal.js'
      - 'home-shell.js'
      - 'supabase/functions/stip-meeting-notes/**'
      - 'supabase/migrations/*meeting*'
      - '.github/workflows/stip-meeting-notes.yml'
  pull_request:
    paths:
      - 'meeting-notes.html'
      - 'meeting-notes.css'
      - 'meeting-notes.js'
      - 'meeting-runtime.css'
      - 'meeting-runtime.js'
      - 'index.html'
      - 'access-runtime.js'
      - 'quick-access.js'
      - 'quick-access-universal.js'
      - 'home-shell.js'
      - 'supabase/functions/stip-meeting-notes/**'
      - 'supabase/migrations/*meeting*'
      - '.github/workflows/stip-meeting-notes.yml'

permissions:
  contents: read

jobs:
  meeting-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript
        run: |
          node --check meeting-notes.js
          node --check meeting-runtime.js
          node --check access-runtime.js
          node --check quick-access.js
          node --check quick-access-universal.js
          node --check home-shell.js
      - name: Type-check meeting notes backend
        run: deno check supabase/functions/stip-meeting-notes/index.ts
      - name: Verify privacy and invitation contract
        shell: bash
        run: |
          grep -q "stip_meeting_invites" supabase/migrations/*meeting_workspace*.sql
          grep -q "stip_meeting_item_recipients" supabase/migrations/*meeting_workspace*.sql
          grep -q "visibility==='shared'" supabase/functions/stip-meeting-notes/index.ts
          grep -q "status==='accepted'" supabase/functions/stip-meeting-notes/index.ts
          grep -q "note privée" docs/meeting-notes.md
          grep -q "meeting-runtime.js" index.html
          grep -q "STIPMeeting" home-shell.js
      - name: Verify old and new note apps remain distinct
        shell: bash
        run: |
          grep -q "'meeting_notes'" supabase/migrations/*meeting_notes*.sql
          grep -q "'notes'" supabase/migrations/20260919105541_canonical_access_catalog.sql
          grep -q "meeting-notes.html" quick-access.js
      - name: Verify live authentication gate
        shell: bash
        run: |
          endpoint='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-meeting-notes'
          headers=$(curl --connect-timeout 8 --max-time 20 -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://ghe.esapin.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-stip-session' \
            "$endpoint")
          echo "$headers" | grep -qi 'access-control-allow-origin: https://ghe.esapin.com'
          code=$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/meeting-notes-response.json -w '%{http_code}' \
            -H 'Origin: https://ghe.esapin.com' \
            -H 'Content-Type: application/json' \
            -d '{"action":"list"}' \
            "$endpoint")
          test "$code" = "401"
          grep -q 'SESSION_STIP_REQUISE' /tmp/meeting-notes-response.json
