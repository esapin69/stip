name: Fix all place navigation
on:
  push:
    paths:
      - '.github/workflows/fix-all-place-navigation.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 tools/fix_place_navigation.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'function destinationsForLevel' places.html
          grep -q 'virtualById.get(id)' places.html
          git config user.name 'STIP navigation fix'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Fix all non-clickable place destinations'
          git push
