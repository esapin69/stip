name: Patch room groups v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-room-groups-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch room group behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')

          old="""function roomFromRange(r,n){const service=byId.get(r.service_place_id);if(!service)return null;return{id:virtualRoomId(r,n),place_type:'virtual_room',display_name:`${String(r.display_prefix||'Chambre').trim()||'Chambre'} ${n}`,official_name:null,parent_id:service.id,building_code:r.building_code||service.building_code||'',level:r.level||service.level||'',summary:cleanTitle(service),details:'',sort_order:Number(n)||0,__virtual_room:true,__room_number:Number(n),__room_range_id:r.id,__service_id:service.id}}
function roomFromId(id){const m=String(id||'').match(/^__room__(\\d+)__(\\d+)$/);if(!m)return null;const r=roomRanges.find(x=>String(x.id)===m[1]);if(!r)return null;const n=Number(m[2]);return n>=Number(r.room_from)&&n<=Number(r.room_to)?roomFromRange(r,n):null}
function roomQueryNumber(q){const n=norm(q),m=n.match(/^(?:(?:chambre|ch|room)\\s+)?(\\d+)$/);return m?Number(m[1]):null}
function roomMatches(q){const typed=roomQueryNumber(q);if(!Number.isFinite(typed))return[];const out=[],seen=new Set();for(const r of roomRanges){const candidates=[typed],off=Number(r.short_number_offset);if(Number.isFinite(off)&&off>0&&typed>off)candidates.push(typed-off);for(const n of candidates){if(n<Number(r.room_from)||n>Number(r.room_to))continue;const key=`${r.id}:${n}`;if(seen.has(key))continue;seen.add(key);const p=roomFromRange(r,n);if(p)out.push(p)}}return out.sort((a,b)=>{const ta=topContainer(a),tb=topContainer(b),c=sortPlaces(ta||a,tb||b);if(c)return c;const fa=floorOrder(a.level),fb=floorOrder(b.level);if(fa!==fb)return fa-fb;const sa=byId.get(a.__service_id),sb=byId.get(b.__service_id),d=sortPlaces(sa||a,sb||b);return d||a.__room_number-b.__room_number})}
"""
          new="""function roomLevelForRange(r){const wantedLevel=levelKey(r.level),wantedCode=norm(r.building_code);if(!wantedLevel)return null;return places.find(p=>{if(p.place_type!=='level'||levelKey(p.level)!==wantedLevel)return false;if(!wantedCode)return true;const top=topContainer(p),codes=[p.building_code,top?.building_code,top?.id,top?.display_name,top?.official_name].map(norm).filter(Boolean);return codes.includes(wantedCode)})||null}
function roomTopForRange(r){const lvl=roomLevelForRange(r);if(lvl)return topContainer(lvl);const wantedCode=norm(r.building_code);if(!wantedCode)return null;return places.find(p=>['hospital','building'].includes(p.place_type)&&[p.building_code,p.id,p.display_name,p.official_name].map(norm).filter(Boolean).includes(wantedCode))||null}
function roomFromRange(r,n){const service=r.service_place_id?byId.get(r.service_place_id):null,lvl=roomLevelForRange(r),top=service?topContainer(service):roomTopForRange(r),parent=service||lvl||top;return{id:virtualRoomId(r,n),place_type:'virtual_room',display_name:`${String(r.display_prefix||'Chambre').trim()||'Chambre'} ${n}`,official_name:null,parent_id:parent?.id||null,building_code:r.building_code||service?.building_code||top?.building_code||'',level:r.level||service?.level||lvl?.level||'',summary:service?cleanTitle(service):'',details:'',sort_order:Number(n)||0,__virtual_room:true,__room_number:Number(n),__room_range_id:r.id,__service_id:service?.id||null,__service_unassigned:!service}}
function roomFromId(id){const m=String(id||'').match(/^__room__(\\d+)__(\\d+)$/);if(!m)return null;const r=roomRanges.find(x=>String(x.id)===m[1]);if(!r)return null;const n=Number(m[2]);return n>=Number(r.room_from)&&n<=Number(r.room_to)?roomFromRange(r,n):null}
function roomQueryNumber(q){const n=norm(q),m=n.match(/^(?:(?:chambre|ch|room)\\s+)?(\\d+)$/);return m?Number(m[1]):null}
function roomMatches(q){const typed=roomQueryNumber(q);if(!Number.isFinite(typed))return[];const raw=[],seen=new Set();for(const r of roomRanges){const candidates=new Set([typed]),off=Number(r.short_number_offset);if(Number.isFinite(off)&&off>0&&typed>off)candidates.add(typed-off);if(typed>=100){const short=typed%100;if(short>0)candidates.add(short)}for(const n of candidates){if(n<Number(r.room_from)||n>Number(r.room_to))continue;const key=`${r.id}:${n}`;if(seen.has(key))continue;seen.add(key);const p=roomFromRange(r,n);if(p)raw.push(p)}}const byLocation=new Map();for(const p of raw){const key=[norm(p.building_code),levelKey(p.level),p.__room_number].join('|'),arr=byLocation.get(key)||[];arr.push(p);byLocation.set(key,arr)}const out=[];for(const arr of byLocation.values()){const assigned=arr.filter(p=>p.__service_id);out.push(...(assigned.length?assigned:arr))}const unique=[...new Map(out.map(p=>[p.id,p])).values()];return unique.sort((a,b)=>{const ta=topContainer(a),tb=topContainer(b),c=sortPlaces(ta||a,tb||b);if(c)return c;const fa=floorOrder(a.level),fb=floorOrder(b.level);if(fa!==fb)return fa-fb;const sa=a.__service_id?byId.get(a.__service_id):null,sb=b.__service_id?byId.get(b.__service_id):null;if(sa&&sb){const d=sortPlaces(sa,sb);if(d)return d}else if(sa&&!sb)return-1;else if(!sa&&sb)return 1;return a.__room_number-b.__room_number})}
"""
          if old not in s:
              raise SystemExit('room helper block not found')
          s=s.replace(old,new,1)

          old="""function roomSearchGroupedHtml(found){const groups=new Map();for(const p of found){const top=topContainer(p)||p,key=top.id||'ghe';if(!groups.has(key))groups.set(key,{top,items:[]});groups.get(key).items.push(p)}return [...groups.values()].sort((a,b)=>sortPlaces(a.top,b.top)).map(g=>{const floors=new Map();for(const p of g.items){const lvl=nearestLevel(p),raw=lvl?.level||p.level||'',key=raw?`f:${String(raw).toUpperCase()}`:'other';if(!floors.has(key))floors.set(key,{raw,items:[]});floors.get(key).items.push(p)}const parts=[...floors.values()].sort((a,b)=>floorOrder(a.raw)-floorOrder(b.raw)).map(f=>{const services=new Map();for(const p of f.items){const service=byId.get(p.__service_id),key=service?.id||'unknown';if(!services.has(key))services.set(key,{service,items:[]});services.get(key).items.push(p)}const body=[...services.values()].sort((a,b)=>sortPlaces(a.service||a.items[0],b.service||b.items[0])).map(s=>`<div class=\"room-service-group\"><div class=\"room-service-title\">${s.service?`<a href=\"${placeHref(s.service)}\">${esc(cleanTitle(s.service))}</a>`:'Service'}</div><div class=\"room-service-brace\"><div class=\"search-cards\">${s.items.sort((a,b)=>a.__room_number-b.__room_number).map(searchCard).join('')}</div></div></div>`).join('');return `<div class=\"search-floor\">${f.raw?`<span class=\"search-floor-label\">${esc(floorLabelFromRaw(f.raw))}</span>`:''}<div class=\"search-brace\">${body}</div></div>`}).join('');return `<section class=\"search-building\">${searchBuildingHeader(g.top)}${parts}</section>`}).join('')}
"""
          new="""function roomSearchGroupedHtml(found){const groups=new Map();for(const p of found){const top=topContainer(p)||roomTopForRange(roomRanges.find(r=>String(r.id)===String(p.__room_range_id))||{})||p,key=top.id||'ghe';if(!groups.has(key))groups.set(key,{top,items:[]});groups.get(key).items.push(p)}return [...groups.values()].sort((a,b)=>sortPlaces(a.top,b.top)).map(g=>{const floors=new Map();for(const p of g.items){const lvl=nearestLevel(p)||roomLevelForRange(roomRanges.find(r=>String(r.id)===String(p.__room_range_id))||{}),raw=lvl?.level||p.level||'',key=raw?`f:${String(raw).toUpperCase()}`:'other';if(!floors.has(key))floors.set(key,{raw,items:[]});floors.get(key).items.push(p)}const parts=[...floors.values()].sort((a,b)=>floorOrder(a.raw)-floorOrder(b.raw)).map(f=>{const services=new Map(),standalone=[];for(const p of f.items){const service=p.__service_id?byId.get(p.__service_id):null;if(!service){standalone.push(p);continue}const key=service.id;if(!services.has(key))services.set(key,{service,items:[]});services.get(key).items.push(p)}const grouped=[...services.values()].sort((a,b)=>sortPlaces(a.service,b.service)).map(s=>`<div class=\"room-service-group\"><div class=\"room-service-title\"><a href=\"${placeHref(s.service)}\">${esc(cleanTitle(s.service))}</a></div><div class=\"room-service-brace\"><div class=\"search-cards\">${s.items.sort((a,b)=>a.__room_number-b.__room_number).map(searchCard).join('')}</div></div></div>`).join(''),loose=standalone.length?`<div class=\"search-cards\">${standalone.sort((a,b)=>a.__room_number-b.__room_number).map(searchCard).join('')}</div>`:'';return `<div class=\"search-floor\">${f.raw?`<span class=\"search-floor-label\">${esc(floorLabelFromRaw(f.raw))}</span>`:''}<div class=\"search-brace\">${grouped}${loose}</div></div>`}).join('');return `<section class=\"search-building\">${searchBuildingHeader(g.top)}${parts}</section>`}).join('')}
"""
          if old not in s:
              raise SystemExit('room grouped renderer not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-room-groups-v2.yml
          git add places.html
          git commit -m "Répare la recherche par groupes de chambres"
          git push
