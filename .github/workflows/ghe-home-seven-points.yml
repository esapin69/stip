name: GHE home seven-point regression
on:
  pull_request:
    paths:
      - ghe-smart-drawer.js
      - ghe-date-separator.js
      - ghe-smart-choices.js
      - tools/ghe-date-separator-test.mjs
      - ghe-smart-drawer.css
      - ghe-invitations.js
      - supabase/functions/stip-assistant/index.ts
      - tools/ghe-audit-navigation-test.mjs
      - home-shell.js
      - ghe-premium-safe-flip.css
      - team-home-fusion.js
      - team-home-fusion.css
      - shift-weather-mini.js
      - ghe-notification-controls.js
      - ghe-notification-controls.css
      - index.html
      - places.html
      - places-export.html
      - tools/ghe-places-two-pdfs-test.mjs
      - stip-loader.js
      - stip-sw.js
      - tools/ghe-home-seven-points-test.mjs
      - .github/workflows/ghe-home-seven-points.yml
  push:
    branches: [main]
    paths:
      - ghe-smart-drawer.js
      - ghe-date-separator.js
      - ghe-smart-choices.js
      - tools/ghe-date-separator-test.mjs
      - ghe-smart-drawer.css
      - ghe-invitations.js
      - supabase/functions/stip-assistant/index.ts
      - tools/ghe-audit-navigation-test.mjs
      - home-shell.js
      - ghe-premium-safe-flip.css
      - team-home-fusion.js
      - team-home-fusion.css
      - shift-weather-mini.js
      - ghe-notification-controls.js
      - ghe-notification-controls.css
      - index.html
      - places.html
      - places-export.html
      - tools/ghe-places-two-pdfs-test.mjs
      - stip-loader.js
      - stip-sw.js
      - tools/ghe-home-seven-points-test.mjs
      - .github/workflows/ghe-home-seven-points.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node --check ghe-date-separator.js
          node --check ghe-smart-choices.js
          node --check ghe-smart-drawer.js
          node --check event-feedback.js
          node --check home-shell.js
          node --check team-home-fusion.js
          node --check shift-weather-mini.js
          node --check ghe-notification-controls.js
          node --check stip-loader.js
          node --check stip-sw.js
      - run: node tools/ghe-date-separator-test.mjs
      - run: node tools/ghe-audit-navigation-test.mjs
      - run: node tools/ghe-home-seven-points-test.mjs
      - run: node tools/ghe-places-two-pdfs-test.mjs
      - run: node --test tools/stip-unified-day-popup-test.mjs tools/stip-popup-no-jump-test.mjs
