name: Clean IRM hero once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-places-irm-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old IRM CSS and keep one implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')

          # Delete the obsolete background-based IRM implementation.
          s=re.sub(r'\n\s*/\* STIP_IRM_HERO_PHOTO_V1 \*/.*?(?=\n\s*/\* STIP_SERVICE_FICHE_V1 \*/)', '\n', s, flags=re.S)
          # Delete the later IRM block so there is only one source of truth.
          s=re.sub(r'\n\s*/\* STIP_IRM_COMPLETE_IMAGE_V3 \*/.*?(?=\n\s*</style>)', '\n', s, flags=re.S)
          s=re.sub(r'\n\s*/\* STIP_IRM_HOSPITAL_PATTERN_V1 \*/.*?(?=\n\s*</style>)', '\n', s, flags=re.S)

          css=r'''
    /* STIP_IRM_SINGLE_FINAL */
    .detail-hero.irm-card{padding:0!important;min-height:0!important;height:auto!important;display:block!important;overflow:hidden!important;border:1px solid #c9d9de!important;border-radius:14px!important;background:#fff!important;background-image:none!important;color:var(--ink)!important;text-shadow:none!important}
    .irm-visual{position:relative!important;width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;overflow:hidden!important;background:#071e31!important}
    .irm-visual img{position:relative!important;inset:auto!important;display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important}
    .irm-visual:after{content:""!important;display:block!important;position:absolute!important;left:0!important;right:0!important;bottom:0!important;height:34%!important;background:linear-gradient(180deg,rgba(3,18,29,0),rgba(3,18,29,.48))!important;pointer-events:none!important}
    .irm-title-overlay{position:absolute!important;z-index:2!important;left:18px!important;right:18px!important;bottom:15px!important;padding:0!important;background:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;color:#fff!important;text-shadow:0 2px 8px rgba(0,0,0,.95)!important}
    .irm-title-overlay .detail-type{display:block!important;margin:0 0 5px!important;color:#fff!important;font-size:.64rem!important;font-weight:950!important;letter-spacing:.13em!important}
    .irm-title-overlay h1{margin:0!important;color:#fff!important;font-size:clamp(1.9rem,8vw,2.55rem)!important;line-height:1!important;letter-spacing:-.04em!important}
    .irm-subtitles{padding:13px 18px 15px!important;background:#fff!important}
    .irm-subtitles .detail-official,.irm-subtitles .detail-meta,.irm-subtitles p{margin:0!important;color:#466a76!important;text-shadow:none!important;font-size:.8rem!important;line-height:1.4!important;font-weight:750!important}
    .irm-subtitles>*+*{margin-top:5px!important}
'''
          s=s.replace('</style>', css+'\n</style>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleaned IRM CSS
        run: |
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove conflicting IRM hero layers and show full image'
          git push
