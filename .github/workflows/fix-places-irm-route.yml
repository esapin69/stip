name: Fix IRM like hospital heroes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-places-irm-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust IRM image layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')
          # Keep one IRM CSS implementation only. Same principle as hospital heroes:
          # image fills a stable visual frame, readable text is localized, never a grey filler.
          s=re.sub(r'\n\s*/\* STIP_IRM_SINGLE_V1 \*/.*?(?=\n\s*</style>)','\n',s,flags=re.S)
          s=re.sub(r'\n\s*/\* STIP_IRM_COMPLETE_IMAGE_V3 \*/.*?(?=\n\s*</style>)','\n',s,flags=re.S)
          css=r'''
    /* STIP_IRM_HOSPITAL_PATTERN_V1 */
    .irm-card{padding:0!important;min-height:0!important;display:block!important;overflow:hidden!important;border:1px solid #c9d9de!important;border-radius:14px!important;background:#fff!important;color:var(--ink)!important;text-shadow:none!important;box-shadow:0 12px 28px rgba(10,69,83,.10)!important}
    .irm-visual{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#071e31}
    .irm-visual img{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-height:none!important;object-fit:cover!important;object-position:center!important}
    .irm-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,18,29,.04) 30%,rgba(3,18,29,.16) 62%,rgba(3,18,29,.48) 100%);pointer-events:none}
    .irm-title-overlay{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95)}
    .irm-title-overlay .detail-type{display:block;margin:0 0 5px!important;color:#fff!important;font-size:.65rem!important;font-weight:950!important;letter-spacing:.13em!important}
    .irm-title-overlay h1{margin:0!important;color:#fff!important;font-size:clamp(1.9rem,8vw,2.6rem)!important;line-height:1!important;letter-spacing:-.04em!important}
    .irm-subtitles{padding:13px 18px 15px;background:#fff}
    .irm-subtitles p{margin:0!important;color:#466a76!important;text-shadow:none!important;font-size:.8rem!important;line-height:1.4!important;font-weight:750!important}
    .irm-subtitles p+p{margin-top:5px!important}
    @media(max-width:430px){.irm-visual{aspect-ratio:1.55/1}.irm-title-overlay{left:16px;right:16px;bottom:15px}}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m 'Render IRM photo with proven hospital hero pattern'
          git push
