name: Apply direct IRM CSS fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-places-irm-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace current IRM CSS exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('    /* STIP_IRM_COMPLETE_IMAGE_V3 */')
          end=s.index('\n\n</style>',start)
          css='''    /* STIP_IRM_FINAL_ONE_SOURCE */
    .detail-hero.irm-card{padding:0!important;min-height:0!important;height:auto!important;display:block!important;overflow:hidden!important;border:1px solid #c9d9de!important;border-radius:14px!important;background:#fff!important;background-image:none!important;color:var(--ink)!important;text-shadow:none!important;box-shadow:0 12px 28px rgba(10,69,83,.10)!important}
    .irm-visual{position:relative!important;width:100%!important;height:auto!important;min-height:0!important;overflow:hidden!important;background:#071e31!important}
    .irm-visual img{display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important}
    .irm-visual:after{content:none!important;display:none!important}
    .irm-title-overlay{position:absolute!important;z-index:2!important;left:18px!important;right:18px!important;bottom:15px!important;top:auto!important;height:auto!important;min-height:0!important;padding:0!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;color:#fff!important;text-shadow:0 2px 8px rgba(0,0,0,.95)!important}
    .irm-title-overlay .detail-type{display:block!important;margin:0 0 5px!important;color:#fff!important;font-size:.64rem!important;font-weight:950!important;letter-spacing:.13em!important}
    .irm-title-overlay h1{margin:0!important;color:#fff!important;font-size:clamp(1.9rem,8vw,2.55rem)!important;line-height:1!important;letter-spacing:-.04em!important}
    .irm-subtitles{padding:13px 18px 15px!important;background:#fff!important}
    .irm-subtitles .detail-official,.irm-subtitles .detail-meta,.irm-subtitles p{margin:0!important;color:#466a76!important;text-shadow:none!important;font-size:.8rem!important;line-height:1.4!important;font-weight:750!important}
    .irm-subtitles>*+*{margin-top:5px!important}'''
          s=s[:start]+css+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix IRM full image without grey overlay'
          git push
