name: Fix places IRM and route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-places-irm-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch places.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('places.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
    /* STIP_IRM_COMPLETE_IMAGE_V3 */
    .irm-card{padding:0!important;min-height:0!important;display:block!important;overflow:hidden!important;background:#fff!important;color:var(--ink)!important;text-shadow:none!important;border:1px solid #c9d9de!important}
    .irm-visual{position:relative;width:100%;background:#071e31;overflow:hidden}
    .irm-visual img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center}
    .irm-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,33,.04) 0%,rgba(4,20,33,.02) 42%,rgba(4,20,33,.68) 100%);pointer-events:none}
    .irm-title-overlay{position:absolute;z-index:2;left:22px;right:22px;bottom:18px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.88)}
    .irm-title-overlay .detail-type{margin:0 0 7px;color:#fff!important;font-size:.67rem;font-weight:950;letter-spacing:.13em}
    .irm-title-overlay h1{margin:0;color:#fff;font-size:clamp(1.85rem,8vw,2.55rem);line-height:1;letter-spacing:-.04em}
    .irm-subtitles{padding:15px 22px 17px;background:#fff}
    .irm-subtitles .detail-official,.irm-subtitles .detail-meta,.irm-subtitles p{margin:0!important;color:#355d6b!important;text-shadow:none!important}
    .irm-subtitles .detail-official{font-size:.88rem!important;font-weight:900!important}
    .irm-subtitles .detail-meta{font-size:.82rem!important;font-weight:850!important}
    .irm-subtitles p{font-size:.78rem!important;line-height:1.42!important;font-weight:700!important}
    .irm-subtitles>*+*{margin-top:7px!important}
    @media(max-width:430px){.irm-title-overlay{left:16px;right:16px;bottom:14px}.irm-subtitles{padding:13px 16px 15px}}
'''
          if 'STIP_IRM_COMPLETE_IMAGE_V3' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          old = '''const ACCESS_MODE=new URLSearchParams(location.search).get('mode')||'auto';'''
          new = '''const ACCESS_MODE=new URLSearchParams(location.search).get('mode')||'auto';\nconst ROUTE_STORE='stip_places_route_v1';'''
          if 'ROUTE_STORE' not in s:
              s = s.replace(old, new, 1)

          marker = '''const irmHeroClass=isIrm?' irm-photo-hero':'';detail.innerHTML=`<a class="detail-back" href="#">‹ Retour à Visiter les lieux</a><article class="detail-hero${hospitalHeroClass}${irmHeroClass}"><span class="detail-type">${esc(typeLabels[p.place_type]||'Lieu')}</span><h1>${esc(cleanTitle(p))}</h1>${official?`<p class="detail-official">${esc(official)}</p>`:''}${loc?`<p class="detail-meta">${esc(loc)}</p>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}</article>${navHtml(p)}'''
          replacement = '''const irmHeroClass=isIrm?' irm-photo-hero':'';const heroHtml=isIrm?`<article class="detail-hero irm-card"><div class="irm-visual"><img src="images/irm/irm-header.jpg" alt=""><div class="irm-title-overlay"><span class="detail-type">${esc(typeLabels[p.place_type]||'Lieu')}</span><h1>${esc(cleanTitle(p))}</h1></div></div><div class="irm-subtitles">${official?`<p class="detail-official">${esc(official)}</p>`:''}${loc?`<p class="detail-meta">${esc(loc)}</p>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}</div></article>`:`<article class="detail-hero${hospitalHeroClass}${irmHeroClass}"><span class="detail-type">${esc(typeLabels[p.place_type]||'Lieu')}</span><h1>${esc(cleanTitle(p))}</h1>${official?`<p class="detail-official">${esc(official)}</p>`:''}${loc?`<p class="detail-meta">${esc(loc)}</p>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}</article>`;detail.innerHTML=`<a class="detail-back" href="#">‹ Retour à Visiter les lieux</a>${heroHtml}${navHtml(p)}'''
          if marker not in s:
              raise SystemExit('IRM render marker not found; refusing unsafe patch')
          s = s.replace(marker, replacement, 1)

          old_route = '''async function renderRoute(){const raw=location.hash.replace(/^#\\/?/,'');if(!raw){home.hidden=false;detail.hidden=true;pageBack.href='./';window.scrollTo({top:0,behavior:'auto'});return}home.hidden=true;detail.hidden=false;pageBack.href='#';detail.innerHTML='<div class="loading">Chargement…</div>';try{await loadData()}catch(e){detail.innerHTML='<div class="empty">Les informations des lieux sont momentanément indisponibles.</div>';return}if(raw==='parkings')renderParkings();else if(raw.startsWith('place/'))renderPlace(decodeURIComponent(raw.slice(6)));else{location.hash='';return}window.scrollTo({top:0,behavior:'auto'})}'''
          new_route = '''async function renderRoute(){let raw=location.hash.replace(/^#\\/?/,'');if(!raw){const saved=sessionStorage.getItem(ROUTE_STORE)||'';if(saved){raw=saved;history.replaceState(null,'',location.pathname+location.search+'#/'+saved)}else{home.hidden=false;detail.hidden=true;pageBack.href='./';window.scrollTo({top:0,behavior:'auto'});return}}sessionStorage.setItem(ROUTE_STORE,raw);home.hidden=true;detail.hidden=false;pageBack.href='#';detail.innerHTML='<div class="loading">Chargement…</div>';try{await loadData()}catch(e){detail.innerHTML='<div class="empty">Les informations des lieux sont momentanément indisponibles.</div>';return}if(raw==='parkings')renderParkings();else if(raw.startsWith('place/'))renderPlace(decodeURIComponent(raw.slice(6)));else{sessionStorage.removeItem(ROUTE_STORE);location.hash='';return}window.scrollTo({top:0,behavior:'auto'})}'''
          if old_route not in s:
              raise SystemExit('Route marker not found; refusing unsafe patch')
          s = s.replace(old_route, new_route, 1)

          old_listeners = '''input.addEventListener('focus',()=>loadData().catch(()=>{}),{once:true});input.addEventListener('input',()=>search(input.value));clear.addEventListener('click',()=>{input.value='';search('');input.focus()});window.addEventListener('hashchange',renderRoute);renderRoute();'''
          new_listeners = '''input.addEventListener('focus',()=>loadData().catch(()=>{}),{once:true});input.addEventListener('input',()=>search(input.value));clear.addEventListener('click',()=>{input.value='';search('');input.focus()});document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.classList.contains('detail-back')||(a===pageBack&&!detail.hidden))sessionStorage.removeItem(ROUTE_STORE)});window.addEventListener('hashchange',renderRoute);renderRoute();'''
          if old_listeners not in s:
              raise SystemExit('Listener marker not found; refusing unsafe patch')
          s = s.replace(old_listeners, new_listeners, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix IRM full image and preserve detail route'
          git push
