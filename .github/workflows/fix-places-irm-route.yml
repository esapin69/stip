name: Fix IRM full photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-places-irm-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix IRM hero CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')
          old='''.irm-visual:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,rgba(4,20,33,0) 0%,rgba(4,20,33,.20) 45%,rgba(4,20,33,.62) 100%);pointer-events:none}\n    .irm-title-overlay{position:absolute;z-index:2;left:22px;right:22px;bottom:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.55)}'''
          new='''.irm-visual:after{display:none!important}\n    .irm-title-overlay{position:absolute;z-index:2;left:18px;right:auto;bottom:16px;max-width:calc(100% - 36px);padding:10px 14px 11px;border-radius:12px;background:rgba(4,20,33,.54);color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.16);text-shadow:0 2px 7px rgba(0,0,0,.95);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}'''
          if old not in s:
              raise SystemExit('current IRM CSS marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove IRM photo veil and localize title contrast'
          git push
