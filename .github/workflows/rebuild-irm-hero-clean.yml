name: Rebuild IRM hero cleanly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-irm-hero-clean.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild IRM hero from one source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          places = Path('places.html')
          s = places.read_text(encoding='utf-8')

          # Remove every historical inline IRM CSS block.
          markers = [
              'STIP_IRM_HERO_PHOTO_V1',
              'STIP_IRM_COMPLETE_IMAGE_V3',
              'STIP_IRM_HOSPITAL_PATTERN_V1',
              'STIP_IRM_SINGLE_FINAL',
              'STIP_IRM_SINGLE_V1',
              'STIP_IRM_FINAL_ONE_SOURCE',
              'STIP_IRM_CLEAN_REBUILD_V1'
          ]
          for marker in markers:
              s = re.sub(
                  r'\n\s*/\*\s*' + re.escape(marker) + r'\s*\*/.*?(?=\n\s*/\*|\n\s*</style>)',
                  '\n', s, flags=re.S
              )

          # Replace the current IRM renderer with one deterministic implementation.
          start = s.find("const isIrm=p.place_type==='exam'")
          if start == -1:
              raise SystemExit('IRM detector not found')
          end = s.find(";detail.innerHTML=", start)
          if end == -1:
              raise SystemExit('IRM render boundary not found')

          prefix = s[start:end]
          detector_pos = prefix.find("const isIrm=")
          if detector_pos == -1:
              raise SystemExit('IRM detector prefix missing')

          new = """const irmIds=new Set(['pw_irm_venus','pw_irm_jupiter','pw_irm_saturne','hfme_mri_nemo','hfme_mri_apollo']);const irmText=norm([p.display_name,p.official_name,...(aliases.get(p.id)||[])].filter(Boolean).join(' '));const isIrm=p.place_type==='exam'&&(irmIds.has(p.id)||irmText.includes('irm')||irmText.includes('mri'));const irmShortTitle=isIrm?cleanTitle(p).replace(/^IRM\\s*(?:\\d+(?:[,.]\\d+)?\\s*T)?\\s*[—–:-]*\\s*/i,'').trim():'';const irmSummary=isIrm?String(p.summary||'').replace(/^IRM\\s*\\d+(?:[,.]\\d+)?\\s*T\\s*[·—–:-]*\\s*/i,'').trim():'';const heroHtml=isIrm?`<article class=\"detail-hero irm-card\"><div class=\"irm-visual\"><img src=\"images/irm/irm-header.jpg?v=20260831-clean1\" width=\"1536\" height=\"1024\" alt=\"Salle d’IRM\"></div><div class=\"irm-overlay\"><span class=\"detail-type\">${esc(typeLabels[p.place_type]||'Examen')}</span><h1>${esc(irmShortTitle||cleanTitle(p))}</h1></div><div class=\"irm-subtitles\">${loc?`<p class=\"irm-location\">${esc(loc)}</p>`:''}${irmSummary?`<p>${esc(irmSummary)}</p>`:''}</div></article>`:`<article class=\"detail-hero${hospitalHeroClass}\"><span class=\"detail-type\">${esc(typeLabels[p.place_type]||'Lieu')}</span><h1>${esc(cleanTitle(p))}</h1>${official?`<p class=\"detail-official\">${esc(official)}</p>`:''}${loc?`<p class=\"detail-meta\">${esc(loc)}</p>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}</article>`"""

          # Keep everything before const isIrm in the local render segment (hospitalHeroClass etc.).
          before = prefix[:detector_pos]
          s = s[:start] + before + new + s[end:]

          css = r'''
    /* STIP_IRM_CLEAN_REBUILD_V1 — one implementation only */
    #detailView .detail-hero.irm-card{position:relative!important;display:block!important;padding:0!important;min-height:0!important;height:auto!important;overflow:hidden!important;border:1px solid #c9d9de!important;border-radius:14px!important;background:#fff!important;background-image:none!important;color:#123b4b!important;text-shadow:none!important;box-shadow:0 12px 28px rgba(10,69,83,.12)!important}
    #detailView .irm-card .irm-visual{position:relative!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;overflow:hidden!important;background:#0b2539!important}
    #detailView .irm-card .irm-visual img{position:relative!important;display:block!important;width:100%!important;height:auto!important;max-width:100%!important;max-height:none!important;min-height:0!important;object-fit:contain!important;object-position:center!important;opacity:1!important;visibility:visible!important}
    #detailView .irm-card .irm-visual:after{content:""!important;position:absolute!important;left:0!important;right:0!important;bottom:0!important;height:34%!important;background:linear-gradient(180deg,rgba(4,20,33,0),rgba(4,20,33,.58))!important;pointer-events:none!important}
    #detailView .irm-card .irm-overlay{position:absolute!important;z-index:3!important;left:18px!important;right:18px!important;top:auto!important;bottom:70px!important;padding:0!important;background:none!important;color:#fff!important;text-shadow:0 2px 9px rgba(0,0,0,.95)!important;pointer-events:none!important}
    #detailView .irm-card .irm-overlay .detail-type{display:block!important;margin:0 0 5px!important;color:#fff!important;font-size:.64rem!important;font-weight:950!important;letter-spacing:.13em!important}
    #detailView .irm-card .irm-overlay h1{margin:0!important;color:#fff!important;font-size:clamp(1.9rem,8vw,2.55rem)!important;line-height:1!important;letter-spacing:-.04em!important;text-shadow:0 2px 9px rgba(0,0,0,.95)!important}
    #detailView .irm-card .irm-subtitles{position:relative!important;z-index:4!important;padding:13px 18px 15px!important;background:#fff!important}
    #detailView .irm-card .irm-subtitles p{margin:0!important;color:#466a76!important;text-shadow:none!important;font-size:.8rem!important;line-height:1.4!important;font-weight:750!important}
    #detailView .irm-card .irm-subtitles .irm-location{color:#234f5e!important;font-weight:900!important}
    #detailView .irm-card .irm-subtitles p+p{margin-top:5px!important}
    @media(max-width:430px){#detailView .irm-card .irm-overlay{left:16px!important;right:16px!important;bottom:68px!important}#detailView .irm-card .irm-subtitles{padding:12px 16px 14px!important}}
'''
          s = s.replace('</style>', css + '\n</style>', 1)
          places.write_text(s, encoding='utf-8')

          # Remove the obsolete external IRM pseudo-element implementation.
          theme = Path('stip-theme.css')
          t = theme.read_text(encoding='utf-8')
          t = re.sub(
              r'\n/\* IRM : photo entière, titre lisible sur l.image, informations secondaires sous l.image\. \*/.*?\Z',
              '\n', t, flags=re.S
          )
          theme.write_text(t, encoding='utf-8')
          PY

      - name: Commit rebuilt IRM hero
        shell: bash
        run: |
          git config user.name "STIP automation"
          git config user.email "actions@users.noreply.github.com"
          git add places.html stip-theme.css
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Rebuild IRM hero from one clean implementation"
          git push
