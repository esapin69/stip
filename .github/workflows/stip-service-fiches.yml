name: Apply STIP service fiche architecture
on:
  push:
    paths:
      - '.github/workflows/stip-service-fiches.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch places.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')
          if 'STIP_SERVICE_FICHE_V1' not in s:
              css='    /* STIP_SERVICE_FICHE_V1 */\n    .service-guide{margin-top:22px}.service-guide-title{margin:0 2px 9px;color:#315e69;font-size:.72rem;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.guide-stack{display:grid;gap:12px}.guide-block{padding:15px 16px;border:1px solid #c8dce0;border-radius:14px;background:#fff;box-shadow:0 7px 18px rgba(18,59,75,.05)}.guide-block h2{margin:0 0 7px;color:#123b4b;font-size:1rem}.guide-values{display:grid;gap:7px;margin-top:9px}.guide-value{padding:9px 10px;border-radius:10px;background:#f4f9fa;color:#456873;font-size:.76rem;line-height:1.42;font-weight:700}.internal-divider{display:flex;align-items:center;gap:10px;margin:32px 0 12px;color:#8b2635;font-size:.71rem;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.internal-divider:before,.internal-divider:after{content:"";height:2px;flex:1;background:#d8a6ad}.internal-zone{padding:16px;border:1px solid #e0b7bd;border-radius:16px;background:#fffafa}.internal-zone>p{margin:0 0 13px;color:#75525a;font-size:.76rem;line-height:1.45;font-weight:720}.completion-grid,.internal-cards{display:grid;gap:8px}.completion-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #ead6d9;border-radius:11px;background:#fff}.completion-row strong{min-width:0;color:#304f59;font-size:.77rem}.completion-badge{flex:0 0 auto;display:inline-flex;align-items:center;min-height:25px;padding:0 8px;border-radius:999px;font-size:.64rem;font-weight:950}.completion-badge.missing{background:#ffe3e6;color:#aa1f32;border:1px solid #f3b8c0}.completion-badge.done{background:#e6f4ee;color:#27624d;border:1px solid #bddfd2}.internal-cards{margin-top:16px}.internal-card{padding:13px 14px;border:1px solid #ead6d9;border-radius:12px;background:#fff}.internal-card-head{display:flex;align-items:center;justify-content:space-between;gap:9px}.internal-card h3{margin:0;color:#5f3038;font-size:.84rem}.internal-card-empty{margin-top:8px;color:#8a6a70;font-size:.72rem;font-weight:720}.internal-subtitle{margin:17px 0 8px;color:#8b2635;font-size:.68rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase}\n'
              s=s.replace('  </style>',css+'  </style>',1)
          if 'STIP_SERVICE_GUIDE_JS_V1' not in s:
              helpers='''\n/* STIP_SERVICE_GUIDE_JS_V1 */\nfunction isInternalAccess(){return !!localStorage.getItem(STORE)}\nfunction tagValuesFor(p,prefixes){const all=tags.get(p.id)||[],out=[];for(const raw of all){const t=String(raw||'');for(const prefix of prefixes){if(t.toLowerCase().startsWith(prefix.toLowerCase())){const v=t.slice(prefix.length).trim();if(v)out.push(v);break}}}return [...new Set(out)]}\nfunction valuesHtml(values){return values.length?`<div class="guide-values">${values.map(v=>`<div class="guide-value">${esc(v)}</div>`).join('')}</div>`:''}\nfunction guideBlock(title,body){return body?`<section class="guide-block"><h2>${esc(title)}</h2>${body}</section>`:''}\nfunction serviceGuideData(p){return{routeMarkup:routesHtml(p),nearMarkup:relationsHtml(p),arrival:tagValuesFor(p,['arrival:','arrivee:','repere_arrivee:']),inside:tagValuesFor(p,['inside:','dans_service:']),landmarks:tagValuesFor(p,['landmark:','repere:']),access:tagValuesFor(p,['accessibility:','accessibilite:'])}}\nfunction serviceGuideHtml(p){const g=serviceGuideData(p),parts=[];if(g.routeMarkup)parts.push(guideBlock('Comment y aller',g.routeMarkup));if(g.nearMarkup)parts.push(guideBlock('À proximité',g.nearMarkup));if(g.arrival.length)parts.push(guideBlock('Reconnaître l’arrivée',valuesHtml(g.arrival)));const inside=g.inside.length?g.inside:(p.details&&norm(p.details)!==norm(p.summary)?[p.details]:[]);if(inside.length)parts.push(guideBlock('Dans le service',valuesHtml(inside)));if(g.landmarks.length)parts.push(guideBlock('Repères et équipements utiles',valuesHtml(g.landmarks)));if(g.access.length)parts.push(guideBlock('Accessibilité',valuesHtml(g.access)));return parts.length?`<section class="service-guide"><h2 class="service-guide-title">Se repérer dans ce lieu</h2><div class="guide-stack">${parts.join('')}</div></section>`:''}\nfunction completionRowHtml(label,done){return `<div class="completion-row"><strong>${esc(label)}</strong><span class="completion-badge ${done?'done':'missing'}">${done?'Renseigné':'À compléter'}</span></div>`}\nfunction internalCardHtml(title,values){const done=values.length>0;return `<section class="internal-card"><div class="internal-card-head"><h3>${esc(title)}</h3><span class="completion-badge ${done?'done':'missing'}">${done?'Renseigné':'À compléter'}</span></div>${done?valuesHtml(values):'<div class="internal-card-empty">Information non renseignée.</div>'}</section>`}\nfunction internalServiceHtml(p){if(!isInternalAccess())return'';const g=serviceGuideData(p),transport=tagValuesFor(p,['transport:','patient_transport:']),staffElev=tagValuesFor(p,['staff_elevator:','elevator_staff:','ascenseur_pro:']),contacts=tagValuesFor(p,['contact:','phone:','tel:','telephone:']),particular=tagValuesFor(p,['internal:','particularity:','particularite:']),warnings=tagValuesFor(p,['warning:','vigilance:']),shortcuts=tagValuesFor(p,['shortcut:','raccourci:','liaison_pro:']),care=tagValuesFor(p,['care:','prise_en_charge:']),temporary=tagValuesFor(p,['temporary:','temporaire:']),notes=tagValuesFor(p,['internal_note:','note_terrain:']);const tracker=[['Comment y aller',!!g.routeMarkup],['À proximité',!!g.nearMarkup],['Reconnaître l’arrivée',g.arrival.length>0],['Dans le service',g.inside.length>0||!!p.details],['Repères / équipements',g.landmarks.length>0],['Accessibilité',g.access.length>0],['Transport patient',transport.length>0],['Ascenseurs professionnels',staffElev.length>0],['Contacts',contacts.length>0],['Particularités du service',particular.length>0],['Points de vigilance',warnings.length>0],['Raccourcis / liaisons',shortcuts.length>0],['Prise en charge particulière',care.length>0],['Informations temporaires',temporary.length>0],['Notes terrain STIP',notes.length>0]];return `<div class="internal-divider"><span>Informations internes STIP</span></div><section class="internal-zone"><p>Visible uniquement après connexion. Cette partie n’existe pas dans l’affichage visiteur.</p><div class="internal-subtitle">Avancement de la fiche</div><div class="completion-grid">${tracker.map(x=>completionRowHtml(x[0],x[1])).join('')}</div><div class="internal-subtitle">Informations métier</div><div class="internal-cards">${internalCardHtml('Transport patient',transport)}${internalCardHtml('Ascenseurs professionnels',staffElev)}${internalCardHtml('Contacts',contacts)}${internalCardHtml('Particularités du service',particular)}${internalCardHtml('Points de vigilance',warnings)}${internalCardHtml('Raccourcis et liaisons professionnelles',shortcuts)}${internalCardHtml('Prise en charge particulière',care)}${internalCardHtml('Informations temporaires',temporary)}${internalCardHtml('Notes terrain STIP',notes)}</div></section>`}\n'''
              s=s.replace('function renderPlace(id){',helpers+'\nfunction renderPlace(id){',1)
          start=s.find('function renderPlace(id){')
          end=s.find('\nfunction renderParkings(){',start)
          if start<0 or end<0: raise SystemExit('renderPlace boundary missing')
          new_render='''function renderPlace(id){const p=byId.get(id);if(!p){detail.innerHTML=`<a class="detail-back" href="#">‹ Retour à Visiter les lieux</a><div class="empty"><strong>${esc(id||'Lieu')}</strong><br>Cette destination est référencée dans la navigation mais sa fiche n’a pas été reçue par le profil actuel.</div>`;return}const kids=(children.get(id)||[]).filter(x=>usefulTypes.has(x.place_type)),levels=kids.filter(x=>x.place_type==='level'),destinations=kids.filter(x=>destinationTypes.has(x.place_type)),other=kids.filter(x=>!['level',...destinationTypes].includes(x.place_type)),loc=[p.building_code,p.level&&floorLabelFromRaw(p.level)].filter(Boolean).join(' · '),official=officialLine(p),isContainer=['hospital','building'].includes(p.place_type),isLevel=p.place_type==='level',isService=destinationTypes.has(p.place_type);let sections='';if(isContainer)sections=levels.length?containerSections(p,levels,destinations):sectionHtml('Services et unités',destinations,false);else if(isLevel)sections=sectionHtml('Lieux et services de cet étage',destinations,false,{hfme:topContainer(p)?.id==='hfme'})+sectionHtml('Autres secteurs',other,false);else sections=sectionHtml('À l’intérieur',kids,false);const serviceContent=isService?serviceGuideHtml(p):`${detailsHtml(p)}${routesHtml(p)}${relationsHtml(p)}`;const internalContent=isService?internalServiceHtml(p):'';detail.innerHTML=`<a class="detail-back" href="#">‹ Retour à Visiter les lieux</a><article class="detail-hero"><span class="detail-type">${esc(typeLabels[p.place_type]||'Lieu')}</span><h1>${esc(cleanTitle(p))}</h1>${official?`<p class="detail-official">${esc(official)}</p>`:''}${loc?`<p class="detail-meta">${esc(loc)}</p>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}</article>${navHtml(p)}${breadcrumbHtml(p)}${locationHtml(p)}${serviceContent}${elevatorReferenceHtml(p)}${elevatorStopsHtml(p)}${helipadInfoHtml(p)}${constraintsHtml(p)}${internalContent}${sections}`}\n'''
          s=s[:start]+new_render+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- places.html; then exit 0; fi
          git config user.name 'STIP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'feat: add two-level service fiche architecture'
          git push origin HEAD:main
