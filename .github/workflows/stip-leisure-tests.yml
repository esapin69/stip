name: GHE leisure behavior
on:
  push:
    paths: ['ghe-smart-drawer.*', 'ghe-invitations.*', 'ghe-agenda.html', 'supabase/migrations/20261016*.sql', 'supabase/functions/stip-leisure/index.ts', 'COMMUNICATION_RULES.md', 'tools/ghe-smart-drawer-test.mjs', 'ensemble-home.js', 'ensemble-v3.*', 'quick-access.js', 'quick-access.css', 'index.html', 'sorties-loisirs.html', 'home-shell.js', 'tools/stip-leisure-test.mjs', 'tools/stip-ensemble-mobile-test.mjs', 'tools/stip-on-se-retrouve-interaction-test.mjs', 't-est/accueil/accueil-modules-natifs.js', 't-est/accueil/accueil-unifie.js', 't-est/accueil/index.html', '.github/workflows/stip-leisure-tests.yml']
  pull_request:
    paths: ['ghe-smart-drawer.*', 'ghe-invitations.*', 'ghe-agenda.html', 'supabase/migrations/20261016*.sql', 'supabase/functions/stip-leisure/index.ts', 'COMMUNICATION_RULES.md', 'tools/ghe-smart-drawer-test.mjs', 'ensemble-home.js', 'ensemble-v3.*', 'quick-access.js', 'quick-access.css', 'index.html', 'sorties-loisirs.html', 'home-shell.js', 'tools/stip-leisure-test.mjs', 'tools/stip-ensemble-mobile-test.mjs', 'tools/stip-on-se-retrouve-interaction-test.mjs', 't-est/accueil/accueil-modules-natifs.js', 't-est/accueil/accueil-unifie.js', 't-est/accueil/index.html', '.github/workflows/stip-leisure-tests.yml']
jobs:
  leisure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ghe-smart-drawer.js
      - run: node --check ghe-invitations.js
      - run: node tools/ghe-smart-drawer-test.mjs
      - run: node --check ensemble-v3.js
      - run: node tools/stip-ensemble-mobile-test.mjs
      - run: node tools/stip-on-se-retrouve-interaction-test.mjs
      - run: node tools/stip-leisure-test.mjs
      - run: node --check ensemble-home.js
      - run: node --check quick-access.js
      - run: node --check home-shell.js
      - run: node --check t-est/accueil/accueil-modules-natifs.js
      - run: node --check t-est/accueil/accueil-unifie.js
