name: Patch room fiches v2

on:
  push:
    paths:
      - '.github/workflows/patch-room-fiches-v2.yml'
      - 'patch_room_fiches_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python patch_room_fiches_v2.py
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('places.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('No inline script found in places.html')
          Path('/tmp/places-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/places-inline.js
          grep -q 'mode=visitor' index.html
          grep -q 'mode=pro' places-entry.js
          grep -q 'STIP_ROOM_FICHE_V2' places.html
          git rm .github/workflows/patch-room-fiches-v2.yml patch_room_fiches_v2.py
          git config user.name 'STIP maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html places-entry.js index.html
          git commit -m 'Finalise les fiches chambres et les accès visiteur pro'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
