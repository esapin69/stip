name: Refine service pages
on:
  push:
    paths:
      - '.github/workflows/refine-service-pages.yml'
      - 'tools/refine_service_pages.py'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 tools/refine_service_pages.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'À quoi sert ce service ?' places.html
          grep -q 'Contacts internes' places.html
          grep -q 'isGuideOnlySummarySegment' places.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('places.html').read_text()
          for i,x in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
              f=Path(tempfile.gettempdir())/f'stip-{i}.js'
              f.write_text(x)
              subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'STIP service pages'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Refine service pages for public and internal use'
          git push
