name: Finalize hospital text layout
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-hospital-text-layout.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '' | base64 -d | python3
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add places.html && (git diff --cached --quiet || (git commit -m 'Finalise le placement des textes hôpitaux' && git push))
