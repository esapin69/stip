name: Complete service skeleton
on:
  push:
    paths:
      - '.github/workflows/complete-service-skeleton.yml'
      - 'tools/complete_service_skeleton.py'
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 tools/complete_service_skeleton.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'Présentation du service à compléter' places.html
          grep -q 'Coordonnées publiques et rendez-vous à compléter' places.html
          grep -q "guideBlock('Comment y aller',g.routeMarkup,true)" places.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('places.html').read_text()
          for i,x in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
              f=Path(tempfile.gettempdir())/f'stip-complete-{i}.js'
              f.write_text(x)
              subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'STIP service pages'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Prepare every service page with complete structure'
          git push
