name: Fix places search matching

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-place-search.yml'
      - 'places.html'

permissions:
  contents: write

jobs:
  patch-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch places search
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('places.html')
          text = path.read_text(encoding='utf-8')

          old_index = "index=places.map(p=>({p,text:norm([cleanTitle(p),p.display_name,p.official_name,p.building_code,p.level,p.summary,p.details,...(aliases.get(p.id)||[]),...(tags.get(p.id)||[])].filter(Boolean).join(' '))}))"
          new_index = "index=places.map(p=>{const primary=norm([cleanTitle(p),p.display_name,p.official_name,p.building_code,p.level,...(aliases.get(p.id)||[]),...(tags.get(p.id)||[])].filter(Boolean).join(' ')),secondary=norm([p.summary,p.details].filter(Boolean).join(' '));return{p,primary,secondary,text:[primary,secondary].filter(Boolean).join(' ')}})"
          if old_index in text:
              text = text.replace(old_index, new_index, 1)

          new_score = r'''function score(item,q){const n=norm(q);if(!n)return 0;const terms=n.split(' ').filter(Boolean),words=v=>String(v||'').split(' ').filter(Boolean),matches=(v,t)=>words(v).some(w=>w===t||w.startsWith(t)),primaryOk=terms.every(t=>matches(item.primary,t)),allOk=terms.every(t=>matches(item.text,t));if(n.length<=3&&!primaryOk)return 0;if(!allOk)return 0;const p=item.p,name=norm(cleanTitle(p)),display=norm(p.display_name),official=norm(p.official_name);let s=10;if(primaryOk)s+=45;if(name===n)s+=120;else if(name.startsWith(n))s+=70;else if(words(name).some(w=>w.startsWith(n)))s+=35;if(display===n)s+=95;if(official===n)s+=85;for(const a of aliases.get(p.id)||[]){const na=norm(a);if(na===n)s+=92;else if(na.startsWith(n))s+=46}if(norm(p.building_code)===n)s+=45;if(norm(p.level)===n)s+=25;if(destinationTypes.has(p.place_type))s+=28;return s}'''
          text, count = re.subn(r"function score\(item,q\)\{.*?\}\nfunction parentChain", new_score + "\nfunction parentChain", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('score function patch not applied')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- places.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'stip-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add places.html
          git commit -m 'Make places search precise for short terms'
          git push
