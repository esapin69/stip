name: Fauteuils — validation de la branche de publication
on:
  push:
    branches: [fauteuils-site-release-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe
        run: node --check fauteuil-app.js
      - name: Vérifier contrat de publication
        run: node --test release.test.mjs
      - name: Installer Playwright figé
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Chrome réel, moteur GHE distant, données fictives
        run: node browser-smoke.mjs
      - name: Contrôler la vraie URL en lecture seule et le refus anonyme
        run: node live-smoke.mjs
