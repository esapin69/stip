name: Audit place navigation
on:
  push:
    paths:
      - '.github/workflows/audit-places-navigation.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public place data and audit navigation
        run: |
          python3 - <<'PY'
          import json, urllib.request, re, unicodedata, difflib
          url='https://yzsrmuxghlengnkyphxj.supabase.co/functions/v1/stip-places'
          req=urllib.request.Request(url,data=json.dumps({'action':'bootstrap_public'}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              d=json.load(r)
          places=d.get('places',[])
          children={}
          for p in places:
              if p.get('parent_id'): children.setdefault(p['parent_id'],[]).append(p)
          dest_types={'service','unit','exam','bloc','helipad'}
          dest=[p for p in places if p.get('place_type') in dest_types]
          def norm(s):
              s=unicodedata.normalize('NFD',str(s or ''))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn').lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          def words(s): return {x for x in norm(s).split() if len(x)>1}
          def score(summary,p):
              a=words(summary); b=words(' '.join(str(p.get(k) or '') for k in ('display_name','official_name','summary')))
              if not a or not b: return 0
              overlap=len(a&b)/max(1,len(a))
              seq=difflib.SequenceMatcher(None,norm(summary),norm(p.get('display_name'))).ratio()
              return round(max(overlap,seq),3)
          gaps=[]
          for p in places:
              if p.get('place_type')!='level': continue
              kids=[x for x in children.get(p.get('id'),[]) if x.get('place_type') in dest_types]
              if kids: continue
              summary=str(p.get('summary') or '').strip()
              if not summary: continue
              cand=sorted(((score(summary,x),x) for x in dest),key=lambda z:z[0],reverse=True)
              cand=[{'score':s,'id':x.get('id'),'name':x.get('display_name'),'parent_id':x.get('parent_id'),'level':x.get('level')} for s,x in cand[:6] if s>=0.28]
              gaps.append({'level_id':p.get('id'),'parent_id':p.get('parent_id'),'level':p.get('level'),'summary':summary,'candidates':cand})
          orphan=[{k:p.get(k) for k in ('id','display_name','parent_id','level','building_code','summary')} for p in dest if not p.get('parent_id')]
          out={'places':len(places),'destinations':len(dest),'levels_with_summary_but_no_destination':gaps,'destinations_without_parent':orphan}
          open('places-navigation-gaps.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'STIP audit'
          git config user.email 'actions@users.noreply.github.com'
          git add places-navigation-gaps.json
          git commit -m 'chore: generated compact navigation gap audit' || exit 0
          git push
