name: GHE scroll stability

on:
  pull_request:
    paths:
      - "app.js"
      - "home-shell.js"
      - "stip-popup-continuity.js"
      - "stip-popup-continuity.css"
      - "styles.css"
      - "index.html"
      - "stip-sw.js"
      - "tools/stip-popup-continuity-test.mjs"
      - "tools/stip-popup-no-jump-test.mjs"
      - "tools/stip-scroll-stability-test.mjs"
      - ".github/workflows/stip-scroll-stability.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "home-shell.js"
      - "stip-popup-continuity.js"
      - "stip-popup-continuity.css"
      - "styles.css"
      - "index.html"
      - "stip-sw.js"
      - "tools/stip-popup-continuity-test.mjs"
      - "tools/stip-popup-no-jump-test.mjs"
      - "tools/stip-scroll-stability-test.mjs"
      - ".github/workflows/stip-scroll-stability.yml"

permissions:
  contents: read

jobs:
  scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check app.js
          node --check home-shell.js
          node --check stip-popup-continuity.js
      - name: Popup scroll and background stability
        run: |
          node --test tools/stip-popup-continuity-test.mjs tools/stip-popup-no-jump-test.mjs tools/stip-scroll-stability-test.mjs
