name: Patch room search integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-room-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch places
        run: python patch-room-search.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm patch-room-search.py .github/workflows/patch-room-search.yml
          git add places.html
          git commit -m "Branch room search into places"
          git push
