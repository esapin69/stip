name: Patch room search integration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-room-search.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch places room search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('places.html')
          s=p.read_text(encoding='utf-8')

          css='''\n    /* STIP_ROOM_SEARCH_V1 */\n    .room-service-group{margin-top:9px}.room-service-group+.room-service-group{margin-top:13px;padding-top:12px;border-top:1px dashed #d8e6e9}.room-service-title{display:flex;align-items:center;gap:8px;margin:0 0 7px;color:#315e69;font-size:.72rem;font-weight:950}.room-service-title a{color:var(--primary);text-decoration:none}.room-service-brace{position:relative;padding:3px 0 3px 15px}.room-service-brace:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;border-left:2px solid #7fb3bc;border-top:2px solid #7fb3bc;border-bottom:2px solid #7fb3bc;border-radius:9px 0 0 9px}.room-range-card .room-range-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.room-range-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:1px solid #b8d4da;border-radius:999px;background:#f4f9fa;color:#214f5d;font-size:.74rem;font-weight:900;text-decoration:none}.room-range-chip[href]:after{content:"›";color:var(--arrow);font-size:1rem}.room-owner-link{display:grid;grid-template-columns:minmax(0,1fr) 38px;align-items:center;margin-top:9px;border:1px solid #c9d9de;border-radius:12px;background:#f8fbfc;color:var(--ink);text-decoration:none;overflow:hidden}.room-owner-link>span{padding:11px 12px}.room-owner-link strong{display:block;font-size:.86rem}.room-owner-link small{display:block;margin-top:4px;color:var(--muted);font-size:.7rem;font-weight:760}.room-owner-link b{height:100%;display:grid;place-items:center;border-left:1px solid #d9e5e8;color:var(--arrow);font-size:1.35rem}.room-detail-note{margin-top:10px;color:#607a83;font-size:.73rem;line-height:1.4;font-weight:720}\n'''
          marker='/* STIP_ROOM_SEARCH_V1 */'
          if marker not in s:
              assert '</style>' in s
              s=s.replace('</style>',css+'</style>',1)

          old="const typeLabels={hospital:'Hôpital',building:'Bâtiment',level:'Étage',service:'Service',unit:'Unité',exam:'Examen',entrance:'Entrée',elevator:'Ascenseur',elevator_group:'Ascenseurs',walkway:'Liaison',landmark:'Repère',room:'Salle',block:'Bloc',parking:'Parking',staff_area:'Zone équipe',hall:'Hall',helipad:'Hélistation'};"
          new="const typeLabels={hospital:'Hôpital',building:'Bâtiment',level:'Étage',service:'Service',unit:'Unité',exam:'Examen',entrance:'Entrée',elevator:'Ascenseur',elevator_group:'Ascenseurs',walkway:'Liaison',landmark:'Repère',room:'Salle',virtual_room:'Chambre',block:'Bloc',parking:'Parking',staff_area:'Zone équipe',hall:'Hall',helipad:'Hélistation'};"
          assert old in s
          s=s.replace(old,new,1)

          old="let data=null,places=[],index=[],byId=new Map(),virtualById=new Map(),children=new Map(),aliases=new Map(),tags=new Map(),relations=[],routes=[],routeSteps=[],constraints=[],elevatorStops=[];"
          new="let data=null,places=[],index=[],byId=new Map(),virtualById=new Map(),children=new Map(),aliases=new Map(),tags=new Map(),relations=[],routes=[],routeSteps=[],constraints=[],elevatorStops=[],roomRanges=[];"
          assert old in s
          s=s.replace(old,new,1)

          old="function build(d){data=d;places=d.places||[];relations=d.relations||[];routes=d.routes||[];routeSteps=d.route_steps||[];constraints=d.constraints||[];elevatorStops=d.elevator_stops||[];byId=new Map();"
          new="function build(d){data=d;places=d.places||[];relations=d.relations||[];routes=d.routes||[];routeSteps=d.route_steps||[];constraints=d.constraints||[];elevatorStops=d.elevator_stops||[];roomRanges=d.room_ranges||[];byId=new Map();"
          assert old in s
          s=s.replace(old,new,1)

          anchor="function searchCard(p){"
          assert anchor in s
          helpers=r'''function roomRangesForService(serviceId){return roomRanges.filter(r=>r.service_place_id===serviceId).sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||Number(a.room_from)-Number(b.room_from))}
function roomRangeLabel(r){const prefix=String(r.display_prefix||'Chambre').trim()||'Chambre',a=Number(r.room_from),b=Number(r.room_to);return a===b?`${prefix} ${a}`:`${prefix.endsWith('s')?prefix:prefix+'s'} ${a} à ${b}`}
function virtualRoomId(r,n){return `__room__${r.id}__${n}`}
function roomFromRange(r,n){const service=byId.get(r.service_place_id);if(!service)return null;return{id:virtualRoomId(r,n),place_type:'virtual_room',display_name:`${String(r.display_prefix||'Chambre').trim()||'Chambre'} ${n}`,official_name:null,parent_id:service.id,building_code:r.building_code||service.building_code||'',level:r.level||service.level||'',summary:cleanTitle(service),details:'',sort_order:Number(n)||0,__virtual_room:true,__room_number:Number(n),__room_range_id:r.id,__service_id:service.id}}
function roomFromId(id){const m=String(id||'').match(/^__room__(\d+)__(\d+)$/);if(!m)return null;const r=roomRanges.find(x=>String(x.id)===m[1]);if(!r)return null;const n=Number(m[2]);return n>=Number(r.room_from)&&n<=Number(r.room_to)?roomFromRange(r,n):null}
function roomQueryNumber(q){const n=norm(q),m=n.match(/^(?:(?:chambre|ch|room)\s+)?(\d+)$/);return m?Number(m[1]):null}
function roomMatches(q){const typed=roomQueryNumber(q);if(!Number.isFinite(typed))return[];const out=[],seen=new Set();for(const r of roomRanges){const candidates=[typed],off=Number(r.short_number_offset);if(Number.isFinite(off)&&off>0&&typed>off)candidates.push(typed-off);for(const n of candidates){if(n<Number(r.room_from)||n>Number(r.room_to))continue;const key=`${r.id}:${n}`;if(seen.has(key))continue;seen.add(key);const p=roomFromRange(r,n);if(p)out.push(p)}}return out.sort((a,b)=>{const ta=topContainer(a),tb=topContainer(b),c=sortPlaces(ta||a,tb||b);if(c)return c;const fa=floorOrder(a.level),fb=floorOrder(b.level);if(fa!==fb)return fa-fb;const sa=byId.get(a.__service_id),sb=byId.get(b.__service_id),d=sortPlaces(sa||a,sb||b);return d||a.__room_number-b.__room_number})}
function roomSearchGroupedHtml(found){const groups=new Map();for(const p of found){const top=topContainer(p)||p,key=top.id||'ghe';if(!groups.has(key))groups.set(key,{top,items:[]});groups.get(key).items.push(p)}return [...groups.values()].sort((a,b)=>sortPlaces(a.top,b.top)).map(g=>{const floors=new Map();for(const p of g.items){const lvl=nearestLevel(p),raw=lvl?.level||p.level||'',key=raw?`f:${String(raw).toUpperCase()}`:'other';if(!floors.has(key))floors.set(key,{raw,items:[]});floors.get(key).items.push(p)}const parts=[...floors.values()].sort((a,b)=>floorOrder(a.raw)-floorOrder(b.raw)).map(f=>{const services=new Map();for(const p of f.items){const service=byId.get(p.__service_id),key=service?.id||'unknown';if(!services.has(key))services.set(key,{service,items:[]});services.get(key).items.push(p)}const body=[...services.values()].sort((a,b)=>sortPlaces(a.service||a.items[0],b.service||b.items[0])).map(s=>`<div class="room-service-group"><div class="room-service-title">${s.service?`<a href="${placeHref(s.service)}">${esc(cleanTitle(s.service))}</a>`:'Service'}</div><div class="room-service-brace"><div class="search-cards">${s.items.sort((a,b)=>a.__room_number-b.__room_number).map(searchCard).join('')}</div></div></div>`).join('');return `<div class="search-floor">${f.raw?`<span class="search-floor-label">${esc(floorLabelFromRaw(f.raw))}</span>`:''}<div class="search-brace">${body}</div></div>`}).join('');return `<section class="search-building"><h3 class="search-building-title">${esc(cleanTitle(g.top))}</h3>${parts}</section>`}).join('')}
function serviceRoomsHtml(p){const rr=roomRangesForService(p.id);if(!rr.length)return'';return `<section class="info-card room-range-card"><h2>Chambres du service</h2><div class="room-range-list">${rr.map(r=>{const label=roomRangeLabel(r);if(Number(r.room_from)===Number(r.room_to)){const room=roomFromRange(r,Number(r.room_from));return room?`<a class="room-range-chip" href="${placeHref(room)}">${esc(label)}</a>`:`<span class="room-range-chip">${esc(label)}</span>`}return `<span class="room-range-chip">${esc(label)}</span>`}).join('')}</div></section>`}
function roomOwnerHtml(p){const owner=byId.get(p.__service_id);if(!owner)return'';const meta=[owner.building_code,owner.level&&floorLabelFromRaw(owner.level)].filter(Boolean).join(' · ');return `<section class="info-card room-owner-card"><h2>Service qui s’en occupe</h2><a class="room-owner-link" href="${placeHref(owner)}"><span><strong>${esc(cleanTitle(owner))}</strong>${meta?`<small>${esc(meta)}</small>`:''}</span><b>›</b></a></section>`}
function roomGuideHtml(p){const owner=byId.get(p.__service_id);return owner?serviceGuideHtml(owner):''}
function roomInternalHtml(p){const owner=byId.get(p.__service_id);return owner?internalServiceHtml(owner):''}
'''
          s=s.replace(anchor,helpers+anchor,1)

          old="const found=index.map(x=>({x,s:score(x,q)})).filter(v=>v.s>0).sort((a,b)=>b.s-a.s||sortPlaces(a.x.p,b.x.p)).slice(0,40).map(v=>v.x.p);results.innerHTML=found.length?searchGroupedHtml(found):'<div class=\"search-status\">Aucun résultat. Essaie un service, un examen, un numéro, un bâtiment ou un repère.</div>'}"
          new="const roomFound=roomMatches(q);if(roomFound.length){results.innerHTML=roomSearchGroupedHtml(roomFound);return}const found=index.map(x=>({x,s:score(x,q)})).filter(v=>v.s>0).sort((a,b)=>b.s-a.s||sortPlaces(a.x.p,b.x.p)).slice(0,40).map(v=>v.x.p);results.innerHTML=found.length?searchGroupedHtml(found):'<div class=\"search-status\">Aucun résultat. Essaie un service, un examen, un numéro, un bâtiment ou un repère.</div>'}"
          assert old in s
          s=s.replace(old,new,1)

          old="function renderPlace(id){const p=byId.get(id)||virtualById.get(id);"
          new="function renderPlace(id){const p=byId.get(id)||virtualById.get(id)||roomFromId(id);"
          assert old in s
          s=s.replace(old,new,1)

          old="isService=destinationTypes.has(p.place_type);let sections='';"
          new="isService=destinationTypes.has(p.place_type),isRoom=!!p.__virtual_room;let sections='';"
          assert old in s
          s=s.replace(old,new,1)

          old="else sections=sectionHtml('À l’intérieur',kids,false);const serviceContent=isService?serviceGuideHtml(p):`${detailsHtml(p)}${routesHtml(p)}${relationsHtml(p)}`;const internalContent=isService?internalServiceHtml(p):'';"
          new="else if(isRoom)sections='';else sections=sectionHtml('À l’intérieur',kids,false);const serviceContent=isRoom?roomGuideHtml(p):(isService?serviceGuideHtml(p):`${detailsHtml(p)}${routesHtml(p)}${relationsHtml(p)}`);const internalContent=isRoom?roomInternalHtml(p):(isService?internalServiceHtml(p):'');"
          assert old in s
          s=s.replace(old,new,1)

          old="${breadcrumbHtml(p)}${locationHtml(p)}${serviceContent}"
          new="${breadcrumbHtml(p)}${locationHtml(p)}${isRoom?roomOwnerHtml(p):''}${isService?serviceRoomsHtml(p):''}${serviceContent}"
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-room-search.yml
          git add places.html
          git commit -m "Branch room search into places"
          git push
