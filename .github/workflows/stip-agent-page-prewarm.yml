name: STIP agent-page prewarm

on:
  push:
    branches: [main]
    paths:
      - "stip-loader.js"
      - "stip-loading.js"
      - "agent-directory.js"
      - "agent-dates.js"
      - "agent-dates.html"
      - "tools/stip-agent-data-warm-test.mjs"
      - "tools/stip-agent-page-prewarm-test.mjs"
      - ".github/workflows/stip-agent-page-prewarm.yml"
  pull_request:
    paths:
      - "stip-loader.js"
      - "tools/stip-agent-page-prewarm-test.mjs"
      - ".github/workflows/stip-agent-page-prewarm.yml"

jobs:
  prewarm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check stip-loader.js
      - run: node --check stip-loading.js
      - run: node --check agent-directory.js
      - run: node --check agent-dates.js
      - run: node tools/stip-agent-page-prewarm-test.mjs
      - run: node tools/stip-agent-data-warm-test.mjs
