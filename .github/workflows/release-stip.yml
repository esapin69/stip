name: Release STIP validated batch

on:
  push:
    branches:
      - release/stip
    paths:
      - '.release-request'

permissions:
  contents: write

concurrency:
  group: stip-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash validated work into one production commit
        run: |
          set -euo pipefail
          git fetch origin work/stip-control
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard origin/main
          git merge --squash origin/work/stip-control
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'Release STIP: validated batch'
          else
            git commit -m 'Release STIP: validated batch'
          fi
          git push origin HEAD:main
